name: Temporary work review HTTP proof (not a release gate)
'on':
  push:
    branches:
    - codex/etapa20-review-http-proof
permissions:
  contents: read
concurrency:
  group: work-review-http-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review-http:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtime
    steps:
    - name: Checkout temporary proof and browser probe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: audit
    - name: Checkout immutable production runtime candidate
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: bfe29fb78c86ba7553114d19888ba46cc1fff58d
        path: runtime
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        version: 10.32.1
        run_install: false
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: runtime/.nvmrc
        cache: pnpm
        cache-dependency-path: runtime/pnpm-lock.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Set up Supabase CLI
      uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
      with:
        version: 2.114.0
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - name: Log in to ghcr.io so image pulls are not anonymous and rate limited
      run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
    - name: Start local Supabase and apply migrations
      env:
        SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
      run: |
        supabase stop --no-backup || true
        docker ps -aq --filter 'name=^supabase_.*_offroad$' | xargs -r docker rm -f
        # Retry the boot a few times, alternating registries with a pause, instead of failing the
        # whole gate on a registry limit.
        for attempt in 1 2 3 4 5; do
          if supabase start -x studio,imgproxy,edge-runtime,realtime,supavisor,postgres-meta; then break; fi
          if [ "$attempt" = 5 ]; then echo "supabase start failed after 5 attempts"; exit 1; fi
          if [ "$SUPABASE_INTERNAL_IMAGE_REGISTRY" = public.ecr.aws ]; then
            SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io
          else
            SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws
          fi
          export SUPABASE_INTERNAL_IMAGE_REGISTRY
          echo "supabase start failed on attempt $attempt; waiting 90s before retrying from $SUPABASE_INTERNAL_IMAGE_REGISTRY"
          supabase stop --no-backup || true
          sleep 90
        done
        # A later step that recreates a container (the database rebuild) must name the registry
        # the images came from, or it pulls them again.
        echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=$SUPABASE_INTERNAL_IMAGE_REGISTRY" >> "$GITHUB_ENV"
    - name: Export local Supabase configuration for the app and the tests
      run: |
        set -euo pipefail
        eval "$(supabase status -o env)"
        echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
        echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-${ANON_KEY}}" >> "$GITHUB_ENV"
        echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
        echo "E2E_MAIL_URL=${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}" >> "$GITHUB_ENV"
    - name: Install native consumers for the disposable browser stack
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        OFFROAD_NATIVE_CONSUMERS_DRAFT_INSTALL: isolated-loopback-ci
      run: python3 -B scripts/ci/install-capital-consumers-ci-drafts.py
    - name: Install assessment candidate for the disposable browser stack
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      run: python3 -B scripts/ci/install-assessment-native-local.py
    - name: Install review dashboard on the disposable browser stack
      env:
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        OFFROAD_WORK_REVIEW_DRAFT_INSTALL: isolated-loopback-ci
      run: python3 -B scripts/ci/install-work-review-dashboard-ci-draft.py
    - name: Install exact focused HTTP diagnostic probe
      run: cp ../audit/apps/web/e2e/work-review-history.spec.ts apps/web/e2e/work-review-history.spec.ts
    - name: Build the web app against the local stack
      run: pnpm --filter web build
    - name: Cache Playwright browser
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ hashFiles('runtime/pnpm-lock.yaml') }}
    - name: Install Playwright browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: pnpm --filter web exec playwright install chromium
      timeout-minutes: 6
    - name: Two source-free humans through the exact dashboard HTTP route
      run: pnpm --filter web exec playwright test e2e/work-review-history.spec.ts --output=test-results-review-http
      env:
        CI: 'true'
        OFFROAD_E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-review-http
    - name: Upload actual focused browser diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: work-review-http-proof
        path: |-
          runtime/apps/web/playwright-report-review-http
          runtime/apps/web/test-results-review-http
        if-no-files-found: ignore
        retention-days: 7
    - name: Stop local Supabase
      if: always()
      run: supabase stop --no-backup
