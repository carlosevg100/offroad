name: Native dashboard before/after metadata diagnosis (not a release gate)
'on':
  push:
    branches:
    - codex/etapa20-provider-preview-proof
  workflow_dispatch: {}
permissions:
  contents: read
  packages: read
concurrency:
  group: stage20-focal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-focal:
    name: Cold native preview with safe review performance telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtime
    steps:
    - name: Checkout diagnostic overlays only
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: audit
    - name: Checkout exact runtime 231067
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 23106724c9a510f1cf89c6ac662a94fe0b4a91c3
        path: runtime
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        version: 10.32.1
        run_install: false
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: runtime/.nvmrc
        cache: pnpm
        cache-dependency-path: runtime/pnpm-lock.yaml
    - name: Install dependencies
      id: database_deps
      run: pnpm install --frozen-lockfile
    - name: Overlay declared performance diagnostics only
      run: python3 ../audit/scripts/ci/overlay-review-performance-diagnostics.py
    - name: Set up Supabase CLI
      uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
      with:
        version: 2.114.0
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - name: Log in to ghcr.io so image pulls are not anonymous and rate limited
      run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor
        }}" --password-stdin
    - name: Start local Supabase and apply migrations
      env:
        SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
      run: "# A previous CLI attempt can leave a stopped-but-not-removed project container\
        \ on a\n# recycled hosted runner. Remove only this repository's exact local\
        \ stack before boot.\nsupabase stop --no-backup || true\ndocker ps -aq --filter\
        \ 'name=^supabase_.*_offroad$' | xargs -r docker rm -f\n# Retry the boot a\
        \ few times, alternating registries with a pause, instead of failing the\n\
        # whole gate on a registry limit.\nfor attempt in 1 2 3 4 5; do\n  if supabase\
        \ start -x studio,imgproxy,edge-runtime,realtime,supavisor,postgres-meta,logflare,vector;\
        \ then break; fi\n  if [ \"$attempt\" = 5 ]; then echo \"supabase start failed\
        \ after 5 attempts\"; exit 1; fi\n  if [ \"$SUPABASE_INTERNAL_IMAGE_REGISTRY\"\
        \ = public.ecr.aws ]; then\n    SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io\n\
        \  else\n    SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws\n  fi\n  export\
        \ SUPABASE_INTERNAL_IMAGE_REGISTRY\n  echo \"supabase start failed on attempt\
        \ $attempt; waiting 90s before retrying from $SUPABASE_INTERNAL_IMAGE_REGISTRY\"\
        \n  supabase stop --no-backup || true\n  sleep 90\ndone\n# A later step that\
        \ recreates a container (the database rebuild) must name the registry\n# the\
        \ images came from, or it pulls them again.\necho \"SUPABASE_INTERNAL_IMAGE_REGISTRY=$SUPABASE_INTERNAL_IMAGE_REGISTRY\"\
        \ >> \"$GITHUB_ENV\"\n"
    - name: Resolve local database URL
      id: db
      run: "set -euo pipefail\nSTATUS_ENV=\"$(supabase status -o env)\"\nDB_URL=\"\
        $(printf '%s\\n' \"$STATUS_ENV\" | sed -n 's/^DB_URL=\"\\{0,1\\}\\([^\"]*\\\
        )\"\\{0,1\\}$/\\1/p')\"\nif [ -z \"$DB_URL\" ]; then\n  DB_URL=\"postgresql://postgres:postgres@127.0.0.1:54322/postgres\"\
        \nfi\necho \"url=$DB_URL\" >> \"$GITHUB_OUTPUT\"\nAPI_URL=\"$(printf '%s\\\
        n' \"$STATUS_ENV\" | sed -n 's/^API_URL=\"\\{0,1\\}\\([^\"]*\\)\"\\{0,1\\\
        }$/\\1/p')\"\nPUBLISHABLE_KEY=\"$(printf '%s\\n' \"$STATUS_ENV\" | sed -n\
        \ 's/^PUBLISHABLE_KEY=\"\\{0,1\\}\\([^\"]*\\)\"\\{0,1\\}$/\\1/p')\"\nif [\
        \ -z \"$PUBLISHABLE_KEY\" ]; then\n  PUBLISHABLE_KEY=\"$(printf '%s\\n' \"\
        $STATUS_ENV\" | sed -n 's/^ANON_KEY=\"\\{0,1\\}\\([^\"]*\\)\"\\{0,1\\}$/\\\
        1/p')\"\nfi\nif [ -z \"$API_URL\" ] || [ -z \"$PUBLISHABLE_KEY\" ]; then\n\
        \  echo 'Local Supabase API URL or publishable key unavailable' >&2\n  exit\
        \ 1\nfi\necho \"api_url=$API_URL\" >> \"$GITHUB_OUTPUT\"\necho \"publishable_key=$PUBLISHABLE_KEY\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Install unpublished native consumer drafts in isolated CI only
      id: native_consumers_install
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
        OFFROAD_NATIVE_CONSUMERS_DRAFT_INSTALL: isolated-loopback-ci
      run: python3 -B scripts/ci/install-capital-consumers-ci-drafts.py
    - name: Install assessment candidate only on disposable local database
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
      run: python3 -B scripts/ci/install-assessment-native-local.py
    - name: Install unpublished deterministic provider draft in isolated CI only
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
        OFFROAD_NATIVE_PROVIDER_DRAFT_INSTALL: isolated-loopback-ci
      run: python3 -B scripts/ci/install-capital-provider-ci-draft.py
    - name: Serve the authenticated capital body Edge reader
      env:
        OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
      run: 'set -euo pipefail

        umask 077

        runtime_dir="$RUNNER_TEMP/capital-body-edge"

        mkdir -p "$runtime_dir"

        chmod 700 "$runtime_dir"

        # CLI injects built-in credentials into the server runtime only.

        # JWT verification stays enabled; no privileged key enters a client.

        supabase functions serve > "$runtime_dir/server.log" 2>&1 &

        echo "$!" > "$runtime_dir/server.pid"

        python3 -B scripts/ci/verify-capital-body-edge-ready.py

        '
    - name: Work review dashboard SQL and integrated runner target guards
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
        OFFROAD_WORK_REVIEW_DRAFT_INSTALL: isolated-loopback-ci
      run: 'set -euo pipefail

        python3 -B scripts/ci/install-work-review-dashboard-ci-draft.py

        psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/support/work_review_dashboard.sql

        node --test scripts/evals/stage20-integrated-review.test.mjs scripts/evals/stage20-material-review-adapter.test.mjs

        '
      id: review
      if: ${{ !cancelled() && steps.db.outcome == 'success' }}
    - name: Real provider-family allocations required by cross-family Storage denial
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
        OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
        OFFROAD_E2E_PUBLISHABLE_KEY: ${{ steps.db.outputs.publishable_key }}
      run: node scripts/ci/test-capital-native-provider-sdk.mjs
    - name: 'BEFORE metadata16: full native preview and sanitized dashboard telemetry'
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
        OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
        OFFROAD_E2E_PUBLISHABLE_KEY: ${{ steps.db.outputs.publishable_key }}
        PREVIEW_DRAFTS_IN_LOCAL_STACK: '1'
        PREVIEW_HTTP_NAMESPACE: a8830001
        PREVIEW_INTEGRATED_REVIEW_EVAL: '1'
      run: python3 -B scripts/ci/test-capital-preview-sdk.py
      id: preview_before
    - name: Apply guarded metadata16 ONLY to disposable local stack
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
      run: 'set -euo pipefail

        python3 -c "import os;from urllib.parse import urlparse;assert urlparse(os.environ[''DATABASE_URL'']).hostname
        in (''localhost'',''127.0.0.1'',''::1'')"

        psql "$DATABASE_URL" -X --single-transaction -v ON_ERROR_STOP=1 -f scripts/evals/diagnostics/dashboard-metadata-forward16.sql

        psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/work_review_dashboard_metadata.sql

        '
    - name: 'AFTER metadata16: fresh namespace full preview and sanitized dashboard
        telemetry'
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
        OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
        OFFROAD_E2E_PUBLISHABLE_KEY: ${{ steps.db.outputs.publishable_key }}
        PREVIEW_HTTP_FIXTURE: '1'
        PREVIEW_HTTP_NAMESPACE: a8830002
        PREVIEW_INTEGRATED_REVIEW_EVAL: '1'
      run: 'set -euo pipefail

        # Existing installers already applied the exact full stack above. Do not replay
        guarded DDL.

        python3 -B scripts/ci/test-execution-brief-native-agent.py

        loader="$(printf ''%s\n'' node_modules/.pnpm/tsx@*/node_modules/tsx/dist/loader.mjs
        | head -n 1)"

        node --import "$loader" apps/document-worker/scripts/capital-preview-native-sdk-eval.ts
        --self-test

        node --import "$loader" apps/document-worker/scripts/capital-preview-native-sdk-eval.ts

        '
    - name: Stop the capital body Edge reader
      run: "set -euo pipefail\nruntime_dir=\"$RUNNER_TEMP/capital-body-edge\"\nif\
        \ [ -f \"$runtime_dir/server.pid\" ]; then\n  runtime_pid=\"$(cat \"$runtime_dir/server.pid\"\
        )\"\n  if [[ \"$runtime_pid\" =~ ^[0-9]+$ ]]; then kill \"$runtime_pid\" 2>/dev/null\
        \ || true; fi\nfi\nrm -rf -- \"$runtime_dir\"\n"
      if: always()
    - name: Stop local Supabase
      run: supabase stop --no-backup
      if: always()
