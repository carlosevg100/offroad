name: Optional work purpose contract proof
'on':
  push:
    branches:
    - codex/etapa20-provider-preview-proof
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: provider-preview-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-focal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtime
    steps:
    - name: Checkout temporary proof and fixture assertions
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: audit
    - name: Checkout exact approved runtime
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 3c84fd08b8612376aa03e216e2e81f8591bfb7f2
        path: runtime
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        version: 10.32.1
        run_install: false
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: runtime/.nvmrc
        cache: pnpm
        cache-dependency-path: runtime/pnpm-lock.yaml
    - name: Install dependencies
      id: database_deps
      run: pnpm install --frozen-lockfile
    - name: Set up Supabase CLI
      uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
      with:
        version: 2.114.0
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - name: Log in to ghcr.io so image pulls are not anonymous and rate limited
      run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor
        }}" --password-stdin
    - name: Start local Supabase and apply migrations
      env:
        SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
      run: "# A previous CLI attempt can leave a stopped-but-not-removed project container\
        \ on a\n# recycled hosted runner. Remove only this repository's exact local\
        \ stack before boot.\nsupabase stop --no-backup || true\ndocker ps -aq --filter\
        \ 'name=^supabase_.*_offroad$' | xargs -r docker rm -f\n# Retry the boot a\
        \ few times, alternating registries with a pause, instead of failing the\n\
        # whole gate on a registry limit.\nfor attempt in 1 2 3 4 5; do\n  if supabase\
        \ start -x studio,imgproxy,edge-runtime,realtime,supavisor,postgres-meta,logflare,vector;\
        \ then break; fi\n  if [ \"$attempt\" = 5 ]; then echo \"supabase start failed\
        \ after 5 attempts\"; exit 1; fi\n  if [ \"$SUPABASE_INTERNAL_IMAGE_REGISTRY\"\
        \ = public.ecr.aws ]; then\n    SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io\n\
        \  else\n    SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws\n  fi\n  export\
        \ SUPABASE_INTERNAL_IMAGE_REGISTRY\n  echo \"supabase start failed on attempt\
        \ $attempt; waiting 90s before retrying from $SUPABASE_INTERNAL_IMAGE_REGISTRY\"\
        \n  supabase stop --no-backup || true\n  sleep 90\ndone\n# A later step that\
        \ recreates a container (the database rebuild) must name the registry\n# the\
        \ images came from, or it pulls them again.\necho \"SUPABASE_INTERNAL_IMAGE_REGISTRY=$SUPABASE_INTERNAL_IMAGE_REGISTRY\"\
        \ >> \"$GITHUB_ENV\"\n"
    - name: Resolve local database URL
      id: db
      run: "set -euo pipefail\nSTATUS_ENV=\"$(supabase status -o env)\"\nDB_URL=\"\
        $(printf '%s\\n' \"$STATUS_ENV\" | sed -n 's/^DB_URL=\"\\{0,1\\}\\([^\"]*\\\
        )\"\\{0,1\\}$/\\1/p')\"\nif [ -z \"$DB_URL\" ]; then\n  DB_URL=\"postgresql://postgres:postgres@127.0.0.1:54322/postgres\"\
        \nfi\necho \"url=$DB_URL\" >> \"$GITHUB_OUTPUT\"\nAPI_URL=\"$(printf '%s\\\
        n' \"$STATUS_ENV\" | sed -n 's/^API_URL=\"\\{0,1\\}\\([^\"]*\\)\"\\{0,1\\\
        }$/\\1/p')\"\nPUBLISHABLE_KEY=\"$(printf '%s\\n' \"$STATUS_ENV\" | sed -n\
        \ 's/^PUBLISHABLE_KEY=\"\\{0,1\\}\\([^\"]*\\)\"\\{0,1\\}$/\\1/p')\"\nif [\
        \ -z \"$PUBLISHABLE_KEY\" ]; then\n  PUBLISHABLE_KEY=\"$(printf '%s\\n' \"\
        $STATUS_ENV\" | sed -n 's/^ANON_KEY=\"\\{0,1\\}\\([^\"]*\\)\"\\{0,1\\}$/\\\
        1/p')\"\nfi\nif [ -z \"$API_URL\" ] || [ -z \"$PUBLISHABLE_KEY\" ]; then\n\
        \  echo 'Local Supabase API URL or publishable key unavailable' >&2\n  exit\
        \ 1\nfi\necho \"api_url=$API_URL\" >> \"$GITHUB_OUTPUT\"\necho \"publishable_key=$PUBLISHABLE_KEY\"\
        \ >> \"$GITHUB_OUTPUT\"\n"
    - name: Install native consumers for the disposable browser stack
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
        OFFROAD_NATIVE_CONSUMERS_DRAFT_INSTALL: isolated-loopback-ci
      run: python3 -B scripts/ci/install-capital-consumers-ci-drafts.py
    - name: Install assessment candidate for the disposable browser stack
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
      run: python3 -B scripts/ci/install-assessment-native-local.py
    - name: Install unpublished deterministic provider draft in isolated CI only
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
        OFFROAD_NATIVE_PROVIDER_DRAFT_INSTALL: isolated-loopback-ci
      run: python3 -B scripts/ci/install-capital-provider-ci-draft.py
    - name: Install frozen preview contracts once on cold stack
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
        OFFROAD_PROVIDER_PREVIEW_PROOF: isolated-loopback-ci
      run: python3 -B ../audit/scripts/ci/provider-preview-focal-proof.py --install-preview
    - name: Install review dashboard on the disposable browser stack
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
        OFFROAD_WORK_REVIEW_DRAFT_INSTALL: isolated-loopback-ci
      run: python3 -B scripts/ci/install-work-review-dashboard-ci-draft.py
    - name: Apply new case-fit result contract correction after immutable all25
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
      run: 'cp ../audit/supabase/tests/support/capital_native_provider_results.sql
        supabase/tests/support/capital_native_provider_results.sql

        psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f ../audit/supabase/pending/capital_native_case_fit_result_contract.sql

        '
    - name: Apply guarded preview-only Storage job authority forward on cold stack
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
      run: 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f ../audit/supabase/pending/capital_preview_storage_job_authority.sql

        psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f ../audit/supabase/tests/support/capital_preview_storage_job_authority.sql

        psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f ../audit/supabase/pending/capital_preview_native_artifact_publication.sql

        psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f ../audit/supabase/tests/support/capital_preview_native_artifact_publication.sql

        '
    - name: Apply physical input grammar and bounded boundary validation forwards
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
      run: 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f ../audit/supabase/pending/capital_preview_physical_input_grammar.sql

        psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f ../audit/supabase/tests/support/capital_preview_boundary_validation.sql

        psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f ../audit/supabase/pending/capital_preview_boundary_validation.sql

        cp ../audit/supabase/tests/support/capital_preview_dispatch_policy.sql supabase/tests/support/capital_preview_dispatch_policy.sql

        psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/support/capital_preview_dispatch_policy.sql

        cp ../audit/apps/document-worker/src/integration-preview-processing.ts apps/document-worker/src/integration-preview-processing.ts

        cp ../audit/apps/document-worker/src/integration-preview-processing.test.ts
        apps/document-worker/src/integration-preview-processing.test.ts

        cp ../audit/apps/document-worker/src/integration-preview-native-pipeline.test.ts
        apps/document-worker/src/integration-preview-native-pipeline.test.ts

        '
    - name: Overlay three exact current capture-denial assertions
      run: "for name in provider_research_persistence provider_research_public_catalog_v2\
        \ provider_case_fit_persistence capital_native_provider_results; do\n  cp\
        \ \"../audit/supabase/tests/support/${name}.sql\" \"supabase/tests/support/${name}.sql\"\
        \ndone"
    - name: Complete preview-specific human review projection
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
      run: 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f ../audit/supabase/pending/capital_preview_review_projection.sql

        psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f ../audit/supabase/tests/support/capital_preview_review_projection.sql'
    - name: Bound native preview finalization under the unchanged database timeout
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
      run: 'node --test ../audit/scripts/evals/preview-finalize-bounded-closure.test.mjs

        psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f ../audit/supabase/pending/capital_preview_finalize_bounded_closure.sql

        psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f ../audit/supabase/tests/support/capital_preview_finalize_bounded_closure.sql'
    - name: Optional capital purpose public command and denial regression
      run: 'cp ../audit/supabase/tests/work_optional_capital_purpose.sql supabase/tests/work_optional_capital_purpose.sql

        psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f ../audit/supabase/pending/work_optional_capital_purpose.sql

        psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/work_optional_capital_purpose.sql'
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
    - name: Stop local Supabase
      if: always()
      run: supabase stop --no-backup
