name: Institutional NOWAIT authority proof (focal, not a release gate)
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: institutional-nowait-focal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-focal:
    name: Cold canonical17 plus prospective NOWAIT authority race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtime
    steps:
      - name: Checkout audit overlays only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: audit
      - name: Checkout exact published runtime769
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 769d7b8e66dff29817866347714d5f84ced186f1
          path: runtime
      - name: Guard exact runtime and three closed overlays
        run: |
          python3 - <<'PYGUARD'
          import ast,hashlib,json,shutil,subprocess
          from pathlib import Path
          runtime=Path.cwd().resolve();audit=(runtime.parent/'audit').resolve()
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='769d7b8e66dff29817866347714d5f84ced186f1'
          entries=[{'path': 'supabase/pending/institutional_setup_capture_nowait_order.sql', 'baseSha256': None, 'sha256': '949ffabf2a1dc86ef3d0601b021a3e5511e64a45806e32c1d7ac717722f9005b'}, {'path': 'scripts/ci/test-institutional-setup-capture-concurrency.py', 'baseSha256': '1c6c51353bfe072419aa272132ce6365119d235f5ac62c9cba2d47d6862fd132', 'sha256': '441aeb14ea102f95217606fbca63c84241ead5c74d5a4260a58ee1abf48ab4da'}, {'path': 'supabase/tests/institutional_setup_input_snapshots.sql', 'baseSha256': 'c52331e5716f39f936d368cf17ea84b40e12424cf1bf79b7156fd391c0fedfcc', 'sha256': '76e761c8b1adcc7cea3a77d1728c4a10e4b2ac32e2e72bc7b00ee9133ce82493'}]
          assert len(entries)==3 and len({x['path']for x in entries})==3
          for entry in entries:
           rel=entry['path'];src=audit/rel;dest=runtime/rel
           assert src.is_file() and not src.is_symlink() and audit in src.resolve().parents
           assert hashlib.sha256(src.read_bytes()).hexdigest()==entry['sha256'],rel
           before=hashlib.sha256(dest.read_bytes()).hexdigest()if dest.is_file()else None
           assert before==entry['baseSha256'],rel
           if rel.endswith('.py'):ast.parse(src.read_text())
          for entry in entries:
           dest=runtime/entry['path'];dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(audit/entry['path'],dest)
          manifest=json.loads((runtime/'docs/build/schema-history/stage20-native-canonical.json').read_text())
          assert len(manifest['groups'])==17
          for group in manifest['groups']:
           assert hashlib.sha256((runtime/group['path']).read_bytes()).hexdigest()==group['sha256']
          print('exact_runtime769_three_overlay_hashes_and_canonical17: PASS; no DDL yet')
          PYGUARD
      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.114.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Ensure local PostgreSQL client
        run: |
          command -v psql || { sudo apt-get update -qq && sudo apt-get install -y postgresql-client; }
      - name: Boot disposable Auth Storage and database, cold canonical17
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
        run: |
          set -euo pipefail
          supabase start -x studio,imgproxy,edge-runtime,realtime,supavisor,postgres-meta,logflare,vector,mailpit
          supabase db reset --local --no-seed
          supabase status -o env > "$RUNNER_TEMP/nowait-local-status.env"
          python3 - <<'PYURL'
          import os,re
          from pathlib import Path
          from urllib.parse import urlparse
          lines=Path(os.environ['RUNNER_TEMP'],'nowait-local-status.env').read_text().splitlines()
          values=[line.split('=',1)[1].strip().strip('"')for line in lines if line.startswith('DB_URL=')]
          assert len(values)==1
          u=urlparse(values[0]);assert u.scheme in ('postgresql','postgres') and u.hostname in ('localhost','127.0.0.1','::1') and not u.query and not u.fragment
          with open(os.environ['GITHUB_ENV'],'a')as output:output.write('DATABASE_URL='+values[0]+'\n')
          print('disposable_loopback_database: PASS')
          PYURL
      - name: Apply exact prospective forward only to loopback database
        run: |
          set -euo pipefail
          python3 - <<'PYLOCAL'
          import os
          from urllib.parse import urlparse
          u=urlparse(os.environ['DATABASE_URL'])
          assert u.scheme in ('postgresql','postgres') and u.hostname in ('localhost','127.0.0.1','::1') and not u.query and not u.fragment
          PYLOCAL
          psql "$DATABASE_URL" -Xq -v ON_ERROR_STOP=1 -f supabase/pending/institutional_setup_capture_nowait_order.sql
      - name: Verify current capability and foreign account negatives
        run: psql "$DATABASE_URL" -Xq -v ON_ERROR_STOP=1 -f supabase/tests/institutional_setup_input_snapshots.sql
      - name: Verify genuine two-session NOWAIT races and unchanged authority
        run: python3 -B scripts/ci/test-institutional-setup-capture-concurrency.py
      - name: Stop only disposable local stack
        if: always()
        run: supabase stop --no-backup
