name: Event outbox monitoring
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Install the reviewed alarms before verifying them
        type: boolean
        default: false
      configuration:
        description: Reviewed alarm file to verify or install
        type: choice
        options:
          - apps/document-worker/monitoring/event-outbox-alarms.json
          - apps/document-worker/monitoring/dependency-recompute-alarms.json
        default: apps/document-worker/monitoring/event-outbox-alarms.json
permissions:
  contents: read
  id-token: write
concurrency:
  group: event-outbox-monitoring
  cancel-in-progress: false
jobs:
  monitoring:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test monitoring write boundaries
        run: python3 -B scripts/ci/test-event-outbox-alarms.py
      - name: Use the existing deployment identity without changing IAM
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::389642461544:role/offroadGitHubDeployRole
          aws-region: sa-east-1
      - name: Validate filters and verify or install the reviewed alarms
        env:
          APPLY_CONFIGURATION: ${{ inputs.apply }}
          ALARM_CONFIGURATION: ${{ inputs.configuration || 'apps/document-worker/monitoring/event-outbox-alarms.json' }}
        run: |
          set -euo pipefail
          if [ "$APPLY_CONFIGURATION" = "true" ]; then
            python3 scripts/ci/configure-event-outbox-alarms.py "$ALARM_CONFIGURATION" --apply
          else
            python3 scripts/ci/configure-event-outbox-alarms.py "$ALARM_CONFIGURATION"
          fi
