name: Temporary all25 canonical-start SQL proof (not a release gate)
on:
  push:
    branches: [codex/etapa20-all25-canonical-start-proof]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: all25-canonical-start-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  canonical-start:
    name: All25 before all current root SQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audit harness only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: audit
      - name: Checkout exact current final candidate runtime and contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3c84fd08b8612376aa03e216e2e81f8591bfb7f2
          path: consumers
      - name: Install canonical pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.32.1
          run_install: false
      - name: Set up canonical Node24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: consumers/.nvmrc
      - name: Install frozen core dependencies
        working-directory: consumers
        run: pnpm install --frozen-lockfile
      - name: Verify isolated installer guards without SQL
        run: |
          python3 -B consumers/scripts/ci/install-capital-consumers-ci-drafts.py --self-test
          python3 -B consumers/scripts/ci/install-capital-provider-ci-draft.py --self-test
          cp audit/scripts/ci/install-capital-preview-ci-drafts.py consumers/scripts/ci/install-capital-preview-ci-drafts.py
          python3 -B consumers/scripts/ci/install-capital-preview-ci-drafts.py --self-test
      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.114.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Authenticate image registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Start dedicated Supabase and replay canonical migrations
        working-directory: consumers
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
        run: |
          set -euo pipefail
          supabase stop --no-backup || true
          docker ps -aq --filter 'name=^supabase_.*_offroad$' | xargs -r docker rm -f
          for attempt in 1 2 3 4 5; do
            if supabase start -x studio,imgproxy,edge-runtime,realtime,supavisor,postgres-meta,mailpit,logflare,vector; then break; fi
            if [ "$attempt" = 5 ]; then echo 'Supabase boot exhausted'; exit 1; fi
            if [ "$SUPABASE_INTERNAL_IMAGE_REGISTRY" = public.ecr.aws ]; then
              SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io
            else
              SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws
            fi
            export SUPABASE_INTERNAL_IMAGE_REGISTRY
            supabase stop --no-backup || true
            sleep 90
          done
      - name: Install all25 in their actual dependency order before any root SQL
        working-directory: consumers
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          OFFROAD_NATIVE_CONSUMERS_DRAFT_INSTALL: isolated-loopback-ci
          OFFROAD_NATIVE_PROVIDER_DRAFT_INSTALL: isolated-loopback-ci
          OFFROAD_NATIVE_PREVIEW_DRAFT_INSTALL: isolated-loopback-ci
          OFFROAD_WORK_REVIEW_DRAFT_INSTALL: isolated-loopback-ci
        run: |
          set -euo pipefail
          python3 -B scripts/ci/install-capital-consumers-ci-drafts.py
          python3 -B scripts/ci/install-assessment-native-local.py
          python3 -B scripts/ci/install-capital-provider-ci-draft.py
          python3 -B scripts/ci/install-capital-preview-ci-drafts.py
          python3 -B scripts/ci/install-work-review-dashboard-ci-draft.py
      - name: Overlay nine reviewed current-contract fixtures
        run: |
          set -euo pipefail
          cp audit/supabase/tests/agentic_dcm_work_system.sql consumers/supabase/tests/agentic_dcm_work_system.sql
          cp audit/supabase/tests/institutional_result_dependencies.sql consumers/supabase/tests/institutional_result_dependencies.sql
          cp audit/supabase/tests/institutional_setup_input_snapshots.sql consumers/supabase/tests/institutional_setup_input_snapshots.sql
          cp audit/supabase/tests/company_debt_view_vertical.sql consumers/supabase/tests/company_debt_view_vertical.sql
          cp audit/supabase/tests/project_company_scope.sql consumers/supabase/tests/project_company_scope.sql
          cp audit/supabase/tests/work_dependencies_projection.sql consumers/supabase/tests/work_dependencies_projection.sql
          cp audit/supabase/tests/rls_non_interference.sql consumers/supabase/tests/rls_non_interference.sql
          cp audit/supabase/tests/work_continuation_commands.sql consumers/supabase/tests/work_continuation_commands.sql
          cp audit/supabase/tests/work_update_integration.sql consumers/supabase/tests/work_update_integration.sql
      - name: Run every actual root SQL contract with all25 already installed
        working-directory: consumers
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -euo pipefail
          count=0
          failed=0
          for test_file in supabase/tests/*.sql; do
            count=$((count + 1))
            echo "Running ${test_file}"
            if ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$test_file"; then
              echo "all25_sql_contract_failed=$test_file"
              failed=$((failed + 1))
            fi
          done
          echo "all25_root_sql_count=$count"
          echo "all25_root_sql_failed=$failed"
          # Exact current root enumeration is174 minus3 retired provider tests.
          test "$count" -eq 171
          test "$failed" -eq 0
      - name: Destroy dedicated stack without backup
        if: ${{ always() }}
        working-directory: consumers
        run: supabase stop --no-backup
