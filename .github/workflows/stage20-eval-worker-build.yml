name: Stage 20 immutable worker image proof
on:
  push:
    branches: [codex/etapa20-staging-worker-build]
permissions:
  contents: read
  id-token: write
concurrency:
  group: stage20-eval-worker-build
  cancel-in-progress: false
env:
  AWS_REGION: sa-east-1
  ECR_REPOSITORY: offroad/document-worker
  RUNTIME_SHA: 3c84fd08b8612376aa03e216e2e81f8591bfb7f2
  IMAGE_TAG: stage20-eval-3c84fd08b861
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3c84fd08b8612376aa03e216e2e81f8591bfb7f2
          persist-credentials: false
      - name: Verify immutable source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RUNTIME_SHA"
          test "$IMAGE_TAG" = stage20-eval-3c84fd08b861
      - name: Configure existing AWS OIDC role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::389642461544:role/offroadGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to existing ECR repository
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd
      - name: Build and push only the evaluation tag
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          test "$REGISTRY" = 389642461544.dkr.ecr.sa-east-1.amazonaws.com
          URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --label "org.opencontainers.image.revision=$RUNTIME_SHA" -f apps/document-worker/Dockerfile -t "$URI" .
          docker push "$URI"
          DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'runtime=%s\ntag=%s\ndigest=%s\n' "$RUNTIME_SHA" "$IMAGE_TAG" "$DIGEST"
