name: Gold case baseline

# Runs the fair baseline of a gold case (docs/product/gold-cases/README.md §5): the strongest
# generalist receives the same turns, the same documents, the equivalent content of the frozen
# source pack and the same time window, with no tools and no hint of the rubric. The outputs, the
# run record (every input hash, model, cost) and the governed evaluation evidence are uploaded as
# an artifact and committed beside the case by whoever dispatched the run.
#
# This job holds no provider key. The script requests a governed evaluation through the
# evaluator's own Supabase session; the worker runs the baseline with the provider credentials it
# already holds, reserving every send, repair and fallback in the database first, and the script
# writes what the database committed. `offroadGitHubEvalsRole` reads only the evaluator secret and
# the publishable key the worker also reads.
#
# NOT USABLE YET, by design. The secret `offroad/evaluator` (JSON with `email`, `password` and
# `organizationId`), the evaluator account it names and the evaluation organization do not exist
# yet: they are created by the founder's decision, together with the role's read grant on that
# secret and on `offroad/supabase-publishable-key`, the provider assurances for purpose
# `evaluation` and the opening of the transport switch. Until then this job fails closed with a
# named message and requests nothing.
#
# Budget: each attempt reserves the list-price upper bound of its whole request before it is sent
# (about 38 USD for one gc01 turn on the primary route), so a budget below that ends the run
# partial with budget_exhausted before anything is sent. Manual only: once opened, it spends real
# money with the providers through the worker.

on:
  workflow_dispatch:
    inputs:
      case:
        description: "Gold case to run (gc01 … gc05)"
        required: false
        default: "gc01"
      max_cost:
        description: "Budget in USD for the whole run, reservations included"
        required: false
        default: "25"
      request_id:
        description: "Resume an earlier request by its id instead of creating another evaluation"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: gold-baseline-${{ inputs.case || 'gc01' }}
  cancel-in-progress: false

jobs:
  baseline:
    name: Run the generalist on the frozen information base
    if: github.repository == 'carlosevg100/offroad' && github.ref == 'refs/heads/main'
    environment: intent-router-gold-main
    runs-on: ubuntu-latest
    # The script waits for the committed result until the evaluation budget expires, plus a grace.
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC, no stored key)
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::389642461544:role/offroadGitHubEvalsRole
          aws-region: sa-east-1

      - name: Run the baseline through the governed evaluation transport
        env:
          CASE: ${{ inputs.case || 'gc01' }}
          MAX_COST: ${{ inputs.max_cost || '25' }}
          REQUEST_ID: ${{ inputs.request_id }}
          # The production project, as the worker's task definition names it; not a secret.
          SUPABASE_URL: https://ifnogpksgdadruooqydi.supabase.co
        run: |
          set -euo pipefail
          # The evaluator's credential and the evaluation organization. Absent until the founder
          # creates them: fail closed, by name, before anything is requested. Nothing read here is
          # ever printed, and each value is masked the moment it exists.
          if ! evaluator="$(aws secretsmanager get-secret-value --secret-id offroad/evaluator --query SecretString --output text 2>/dev/null)" || [ -z "$evaluator" ]; then
            echo "::error title=Governed evaluation not configured::offroad/evaluator is absent or not readable by offroadGitHubEvalsRole. The evaluator account, the evaluation organization and this secret are created by the founder's decision; nothing was requested."
            exit 1
          fi
          while IFS= read -r line; do if [ -n "$line" ]; then echo "::add-mask::$line"; fi; done <<<"$evaluator"
          field() { jq -er --arg key "$1" '.[$key] | select(type == "string" and length > 0)' <<<"$evaluator" 2>/dev/null; }
          if ! OFFROAD_EVALUATOR_EMAIL="$(field email)" || ! OFFROAD_EVALUATOR_PASSWORD="$(field password)" || ! OFFROAD_EVALUATION_ORGANIZATION_ID="$(field organizationId)"; then
            echo "::error title=Governed evaluation not configured::offroad/evaluator must hold email, password and organizationId; nothing was requested."
            exit 1
          fi
          echo "::add-mask::$OFFROAD_EVALUATOR_EMAIL"
          echo "::add-mask::$OFFROAD_EVALUATOR_PASSWORD"
          echo "::add-mask::$OFFROAD_EVALUATION_ORGANIZATION_ID"
          unset evaluator
          if ! SUPABASE_PUBLISHABLE_KEY="$(aws secretsmanager get-secret-value --secret-id offroad/supabase-publishable-key --query SecretString --output text 2>/dev/null)" || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error title=Governed evaluation not configured::offroad/supabase-publishable-key is not readable by offroadGitHubEvalsRole; the founder's setup grants it with the evaluator secret. Nothing was requested."
            exit 1
          fi
          echo "::add-mask::$SUPABASE_PUBLISHABLE_KEY"
          export SUPABASE_URL SUPABASE_PUBLISHABLE_KEY OFFROAD_EVALUATOR_EMAIL OFFROAD_EVALUATOR_PASSWORD OFFROAD_EVALUATION_ORGANIZATION_ID

          resume=()
          if [ -n "$REQUEST_ID" ]; then resume=(--request-id "$REQUEST_ID"); fi
          status=0
          pnpm --filter @offroad/evals baseline:gold -- --case "$CASE" --max-cost "$MAX_COST" --out "$RUNNER_TEMP/baseline-run" ${resume[@]+"${resume[@]}"} 2>&1 \
            | grep -vE 'Warning: (TT|Required "glyf"|UnknownErrorException)' | tee /tmp/baseline.log || status=$?

          {
            echo "## Gold baseline: $CASE"
            echo
            grep -E '^(document|source|information base|evaluation|turn|run record)' /tmp/baseline.log | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          # Status 3 is a partial evaluation: its evidence is uploaded below, and the run fails.
          exit "$status"

      - name: Upload the run (outputs, record and evaluation evidence)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gold-baseline-${{ inputs.case || 'gc01' }}
          path: ${{ runner.temp }}/baseline-run
          if-no-files-found: warn
          retention-days: 90
