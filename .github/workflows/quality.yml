name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

  database:
    name: Database (migrations, RLS, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Boots a fresh local stack and applies every file in supabase/migrations from
      # scratch. This proves the migration history is replayable and that no policy,
      # grant, or function depends on state that only exists in the hosted project.
      - name: Start local Supabase and apply migrations
        run: supabase start -x studio,imgproxy,edge-runtime,realtime,supavisor,postgres-meta

      - name: Resolve local database URL
        id: db
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          if [ -z "$DB_URL" ]; then
            DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          fi
          echo "url=$DB_URL" >> "$GITHUB_OUTPUT"

      - name: Tenant non-interference (RLS) test
        run: psql "${{ steps.db.outputs.url }}" -v ON_ERROR_STOP=1 -q -f supabase/tests/rls_non_interference.sql

      - name: Schema lint (public, private)
        run: supabase db lint --local --schema public,private --level warning --fail-on error

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
