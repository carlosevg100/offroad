name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Repeated runs of one commit measure flakiness without a new merge or a rerun.
  workflow_dispatch:
    inputs:
      native_diagnostic:
        description: Run only the isolated native consumer diagnosis; never a release gate
        type: boolean
        required: false
        default: false
      native_diagnostic_target:
        description: Isolate one independent family only when native_diagnostic is true
        type: choice
        required: false
        default: both
        options: [both, debt, material]

permissions:
  contents: read
  packages: read

concurrency:
  # A dispatched run gets its own group so repeated runs of the same commit never cancel each other.
  group: quality-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  check:
    # Diagnostic runs use different check names and cannot satisfy branch protection.
    name: ${{ inputs.native_diagnostic && 'Skipped lint (native diagnostic only)' || 'Lint, typecheck, test, build' }}
    if: ${{ !inputs.native_diagnostic }}
    runs-on: ubuntu-latest
    # The whole monorepo gate took 13.8 to 14.7 minutes on main in September 2026; the same
    # 30-minute ceiling as the database and E2E jobs keeps a slow runner from failing a green tree.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Release-governance tests verify evidence against its declared immutable
          # commit, not merely against the synthetic pull-request merge commit.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify monitoring write boundaries
        run: python3 -B scripts/ci/test-event-outbox-alarms.py

      - name: Verify the deployment verifiers
        run: |
          python3 -B scripts/ci/test_verify_worker_boot_flag.py
          python3 -B scripts/ci/test_verify_web_deployment.py

      - name: Verify immutable published methods
        run: |
          python3 -B scripts/ci/test-published-method-lock.py
          python3 -B scripts/ci/verify-published-method-lock.py

      - name: Verify native provider SDK contracts before the database journey
        run: node scripts/ci/test-capital-native-provider-sdk.mjs --self-test

      - name: Verify preview install ownership and canonical source lookup
        run: |
          python3 -B scripts/ci/test-preview-install-order.py
          python3 -B scripts/ci/test-work-review-dashboard-install.py
          node --test scripts/evals/preview-finalize-bounded-closure.test.mjs

      - name: Run quality gate
        run: pnpm check

  database:
    if: ${{ !inputs.native_diagnostic || inputs.native_diagnostic_target != 'material' }}
    name: ${{ inputs.native_diagnostic && 'Native consumers diagnostic (not a release gate)' || 'Database (migrations, RLS, lint)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify recovered schema history and archive isolation
        if: ${{ !inputs.native_diagnostic }}
        run: |
          python3 scripts/ci/verify-recovered-schema.py
          python3 scripts/ci/test_verify_recovered_schema.py

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          # Pinned: resolving "latest" hits the GitHub API and can be rate-limited on busy days.
          version: 2.114.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Boots a fresh local stack and applies every file in supabase/migrations from
      # scratch. This proves the migration history is replayable and that no policy,
      # grant, or function depends on state that only exists in the hosted project.
      #
      # Keep the local confirmation mail service: the native preview SDK now uses
      # public Auth signup under the configured email-confirmation policy. Mailpit
      # captures disposable CI messages locally; confirmation stays enabled.
      # Studio, image proxy and analytics remain excluded from this database gate.
      #
      # gotrue, postgrest, storage-api and kong deliberately stay: the RLS test writes to
      # `auth.users` and reads `auth.uid()`, and the DB URL is resolved from `supabase status`.
      # Dropping those is plausible but unverified, and this job is the last gate before a
      # migration reaches the only Supabase project we have.
      - name: Log in to ghcr.io so image pulls are not anonymous and rate limited
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start local Supabase and apply migrations
        env:
          # ghcr.io keeps answering toomanyrequests for shared runners even when authenticated, and
          # public.ecr.aws answers "Data limit exceeded" once a shared runner address has spent its
          # anonymous quota. The Supabase CLI publishes the same images on both registries, so the
          # boot starts on the AWS mirror and switches registry on every retry.
          SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
        run: |
          # A previous CLI attempt can leave a stopped-but-not-removed project container on a
          # recycled hosted runner. Remove only this repository's exact local stack before boot.
          supabase stop --no-backup || true
          docker ps -aq --filter 'name=^supabase_.*_offroad$' | xargs -r docker rm -f
          # Retry the boot a few times, alternating registries with a pause, instead of failing the
          # whole gate on a registry limit.
          set -o pipefail
          for attempt in 1 2 3 4 5; do
            if supabase start -x studio,imgproxy,edge-runtime,realtime,supavisor,postgres-meta,logflare,vector 2>&1 | tee "$RUNNER_TEMP/supabase-start-database.log"; then break; fi
            # SQL errors are deterministic and cannot recover by pulling another image.
            if grep -q 'SQLSTATE' "$RUNNER_TEMP/supabase-start-database.log"; then exit 1; fi
            if [ "$attempt" = 5 ]; then echo "supabase start failed after 5 attempts"; exit 1; fi
            if [ "$SUPABASE_INTERNAL_IMAGE_REGISTRY" = public.ecr.aws ]; then
              SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io
            else
              SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws
            fi
            export SUPABASE_INTERNAL_IMAGE_REGISTRY
            echo "supabase start failed on attempt $attempt; waiting 90s before retrying from $SUPABASE_INTERNAL_IMAGE_REGISTRY"
            supabase stop --no-backup || true
            sleep 90
          done
          # A later step that recreates a container (the database rebuild) must name the registry
          # the images came from, or it pulls them again.
          echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=$SUPABASE_INTERNAL_IMAGE_REGISTRY" >> "$GITHUB_ENV"

      - name: Resolve local database URL
        id: db
        run: |
          set -euo pipefail
          STATUS_ENV="$(supabase status -o env)"
          DB_URL="$(printf '%s\n' "$STATUS_ENV" | sed -n 's/^DB_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          if [ -z "$DB_URL" ]; then
            DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          fi
          echo "url=$DB_URL" >> "$GITHUB_OUTPUT"
          API_URL="$(printf '%s\n' "$STATUS_ENV" | sed -n 's/^API_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          PUBLISHABLE_KEY="$(printf '%s\n' "$STATUS_ENV" | sed -n 's/^PUBLISHABLE_KEY="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          if [ -z "$PUBLISHABLE_KEY" ]; then
            PUBLISHABLE_KEY="$(printf '%s\n' "$STATUS_ENV" | sed -n 's/^ANON_KEY="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          fi
          if [ -z "$API_URL" ] || [ -z "$PUBLISHABLE_KEY" ]; then
            echo 'Local Supabase API URL or publishable key unavailable' >&2
            exit 1
          fi
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "publishable_key=$PUBLISHABLE_KEY" >> "$GITHUB_OUTPUT"

      # Every SQL contract is a gate by default. A newly added workspace, cache or
      # RLS regression test must not depend on someone remembering to register it here.
      - name: Verify artifact roundtrip contracts and capture the real replay catalogue
        if: ${{ !inputs.native_diagnostic }}
        run: |
          set -euo pipefail
          psql "${{ steps.db.outputs.url }}" -X -A -t -v ON_ERROR_STOP=1 -f scripts/ci/stage0-catalogue.sql > "$RUNNER_TEMP/stage21-replay-catalogue.json"
          psql "${{ steps.db.outputs.url }}" -X -A -t -v ON_ERROR_STOP=1 -f scripts/ci/stage21-function-catalogue.sql > "$RUNNER_TEMP/stage21-function-catalogue.json"
          DATABASE_URL="${{ steps.db.outputs.url }}" python3 -B - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('snapshot', 'scripts/ci/verify-effective-function-bodies.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          found, absent, resolved = module.database_state(os.environ['DATABASE_URL'], module.migration_targets())
          found = {key: value.decode('utf-8') for key, value in found.items()}
          Path(os.environ['RUNNER_TEMP'], 'stage21-effective-bodies.json').write_text(json.dumps({'found': found, 'absent': sorted(absent), 'resolved': resolved}))
          PY
          psql "${{ steps.db.outputs.url }}" -X -v ON_ERROR_STOP=1 -f supabase/tests/artifact_export_receipts.sql
          psql "${{ steps.db.outputs.url }}" -X -v ON_ERROR_STOP=1 -f supabase/tests/end_to_end_revocation.sql
          psql "${{ steps.db.outputs.url }}" -X -v ON_ERROR_STOP=1 -f supabase/tests/end_to_end_retention_worker.sql
          psql "${{ steps.db.outputs.url }}" -X -v ON_ERROR_STOP=1 -f supabase/tests/immutable_audit_archive.sql
          psql "${{ steps.db.outputs.url }}" -X -v ON_ERROR_STOP=1 -f supabase/tests/sensitive_operation_audit.sql
          psql "${{ steps.db.outputs.url }}" -X -v ON_ERROR_STOP=1 -f supabase/tests/artifact_import_candidates.sql
          psql "${{ steps.db.outputs.url }}" -X -v ON_ERROR_STOP=1 -f supabase/tests/support/artifact_roundtrip_pending_groups_eval.sql
          psql "${{ steps.db.outputs.url }}" -X -v ON_ERROR_STOP=1 -f supabase/tests/institutional_configuration_ancestry.sql


      - name: Upload artifact roundtrip replay evidence
        if: ${{ always() && !inputs.native_diagnostic }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage21-replay-evidence
          path: |
            ${{ runner.temp }}/stage21-replay-catalogue.json
            ${{ runner.temp }}/stage21-function-catalogue.json
            ${{ runner.temp }}/stage21-effective-bodies.json

      - name: Verify effective function bodies match the committed snapshot
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/verify-effective-function-bodies.py

      - name: Check stage-zero access surface and every file version against production journal
        if: ${{ !inputs.native_diagnostic }}
        run: |
          set -euo pipefail
          python3 -B scripts/ci/test_check_stage0_inventory.py
          python3 -B scripts/ci/test_compare_stage21_installed.py
          psql "${{ steps.db.outputs.url }}" -X -A -t -v ON_ERROR_STOP=1 -f scripts/ci/stage0-catalogue.sql > "$RUNNER_TEMP/stage0-replay-catalogue.json"
          python3 -B scripts/ci/check-stage0-inventory.py --catalogue "$RUNNER_TEMP/stage0-replay-catalogue.json" --environment replay --production-journal docs/build/schema-history/production-migration-journal.json

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        id: database_deps
        run: pnpm install --frozen-lockfile

      - name: Install unpublished native consumer drafts in isolated CI only
        id: native_consumers_install
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_NATIVE_CONSUMERS_DRAFT_INSTALL: isolated-loopback-ci
        run: python3 -B scripts/ci/install-capital-consumers-ci-drafts.py

      - name: Native materials SQL production, dispatch and human review
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          MATERIAL_DRAFT_IN_TRANSACTION: "0"
        run: |
          set -euo pipefail
          python3 -B scripts/ci/test-material-production-plan-native.py
          python3 -B scripts/ci/test-material-runtime-dispatch.py
          python3 -B scripts/ci/test-material-package-native-review.py

      - name: Native material human review with two concurrent transactions
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          MATERIAL_DRAFT_IN_TRANSACTION: "0"
          MATERIAL_RACE_SYNTHETIC_LOCAL: "1"
        run: python3 -B scripts/ci/test-material-package-review-race.py

      - name: Run all database contract tests
        if: ${{ !inputs.native_diagnostic }}
        run: |
          set -euo pipefail
          failed_files=()
          for test_file in supabase/tests/*.sql; do
            echo "Running ${test_file}"
            if ! psql "${{ steps.db.outputs.url }}" -v ON_ERROR_STOP=1 -q -f "${test_file}"; then
              failed_files+=("${test_file}")
              echo "::error file=${test_file}::Database contract test failed"
            fi
          done
          if ((${#failed_files[@]})); then
            printf 'Failed database contracts: %s\n' "${failed_files[*]}"
            exit 1
          fi

      - name: Verify review change classification against shared domain fixtures
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-review-change-parity.py

      - name: Verify review authority and competing decisions with two real sessions
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-review-concurrency.py
      - name: Review regime CAS and legacy authority concurrency
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_REPOSITORY_ROOT: ${{ github.workspace }}
        run: python3 -B scripts/ci/test-review-regime-concurrency.py
      - name: Institutional configuration native review and revocation concurrency
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-institutional-configuration-review-concurrency.py
      - name: Capital public capture authority and lock concurrency
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_REPOSITORY_ROOT: ${{ github.workspace }}
        run: python3 -B scripts/ci/test-capital-public-capture-concurrency.py
      - name: Serve the authenticated capital body Edge reader
        env:
          OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
        run: |
          set -euo pipefail
          umask 077
          runtime_dir="$RUNNER_TEMP/capital-body-edge"
          mkdir -p "$runtime_dir"
          chmod 700 "$runtime_dir"
          # CLI injects built-in credentials into the server runtime only.
          # JWT verification stays enabled; no privileged key enters a client.
          supabase functions serve > "$runtime_dir/server.log" 2>&1 &
          echo "$!" > "$runtime_dir/server.pid"
          python3 -B scripts/ci/verify-capital-body-edge-ready.py

      - name: Capital public retention with physical Storage
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
          OFFROAD_E2E_PUBLISHABLE_KEY: ${{ steps.db.outputs.publishable_key }}
          OFFROAD_REPOSITORY_ROOT: ${{ github.workspace }}
        run: python3 -B scripts/ci/test-capital-public-retention-storage.py
      - name: Capital public retention two-session races
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
          OFFROAD_E2E_PUBLISHABLE_KEY: ${{ steps.db.outputs.publishable_key }}
          OFFROAD_REPOSITORY_ROOT: ${{ github.workspace }}
        run: python3 -B scripts/ci/test-capital-public-retention-concurrency.py
      - name: Capital typed bodies with physical HTTP Storage
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
          OFFROAD_E2E_PUBLISHABLE_KEY: ${{ steps.db.outputs.publishable_key }}
          OFFROAD_REPOSITORY_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          umask 077
          fixture_dir="$(mktemp -d "$RUNNER_TEMP/capital-body-http.XXXXXX")"
          export OFFROAD_BODY_STORAGE_FIXTURE_FILE="$fixture_dir/fixture.json"
          cleanup() {
            test_exit=$?
            trap - EXIT
            set +e
            cleanup_exit=0
            if [ -f "$OFFROAD_BODY_STORAGE_FIXTURE_FILE" ]; then
              python3 -B scripts/ci/test-capital-body-retention-storage.py --cleanup-local
              cleanup_exit=$?
            fi
            rm -rf -- "$fixture_dir"
            if [ "$test_exit" -ne 0 ]; then exit "$test_exit"; fi
            exit "$cleanup_exit"
          }
          trap cleanup EXIT
          python3 -B scripts/ci/test-capital-body-retention-storage.py --provision-local
          node scripts/ci/test-capital-body-retention-sdk.mjs --write-accepted-fixture
          python3 -B scripts/ci/test-capital-body-retention-storage.py

      - name: Capital typed bodies through the real Node24 SDK and gateway
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
          OFFROAD_E2E_PUBLISHABLE_KEY: ${{ steps.db.outputs.publishable_key }}
          OFFROAD_REPOSITORY_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          umask 077
          fixture_dir="$(mktemp -d "$RUNNER_TEMP/capital-body-sdk.XXXXXX")"
          export OFFROAD_BODY_STORAGE_FIXTURE_FILE="$fixture_dir/fixture.json"
          cleanup() {
            test_exit=$?
            trap - EXIT
            set +e
            cleanup_exit=0
            if [ -f "$OFFROAD_BODY_STORAGE_FIXTURE_FILE" ]; then
              python3 -B scripts/ci/test-capital-body-retention-storage.py --cleanup-local
              cleanup_exit=$?
            fi
            rm -rf -- "$fixture_dir"
            if [ "$test_exit" -ne 0 ]; then exit "$test_exit"; fi
            exit "$cleanup_exit"
          }
          trap cleanup EXIT
          python3 -B scripts/ci/test-capital-body-retention-storage.py --provision-local
          node scripts/ci/test-capital-body-retention-sdk.mjs --write-accepted-fixture
          node scripts/ci/test-capital-body-retention-sdk.mjs

      - name: Capital typed body revocation and purge with two real SQL sessions
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
          OFFROAD_E2E_PUBLISHABLE_KEY: ${{ steps.db.outputs.publishable_key }}
          OFFROAD_REPOSITORY_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          umask 077
          fixture_dir="$(mktemp -d "$RUNNER_TEMP/capital-body-races.XXXXXX")"
          export OFFROAD_BODY_STORAGE_FIXTURE_FILE="$fixture_dir/fixture.json"
          cleanup() {
            test_exit=$?
            trap - EXIT
            set +e
            cleanup_exit=0
            if [ -f "$OFFROAD_BODY_STORAGE_FIXTURE_FILE" ]; then
              python3 -B scripts/ci/test-capital-body-retention-storage.py --cleanup-local
              cleanup_exit=$?
            fi
            rm -rf -- "$fixture_dir"
            if [ "$test_exit" -ne 0 ]; then exit "$test_exit"; fi
            exit "$cleanup_exit"
          }
          trap cleanup EXIT
          python3 -B scripts/ci/test-capital-body-retention-storage.py --provision-local
          node scripts/ci/test-capital-body-retention-sdk.mjs --write-accepted-fixture
          python3 -B scripts/ci/test-capital-body-retention-concurrency.py
          python3 -B scripts/ci/test-capital-body-attempt-concurrency.py
          python3 -B scripts/ci/test-capital-body-outcome-concurrency.py

      - name: Capital body SQL and Node outcome protocol gold
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-capital-body-outcome-protocol.py

      - name: Execution artifact recovery concurrency
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-execution-artifact-recovery-concurrency.py
      - name: Execution source closure revocation concurrency
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-execution-source-closure-concurrency.py
      - name: Institutional input capture concurrency
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-institutional-capture-concurrency.py

      - name: Institutional setup capture concurrency
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-institutional-setup-capture-concurrency.py

      - name: Native execution brief activation with the real compiler
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          S11_FIXTURE_CONTINUATION: supabase/tests/support/execution_brief_native_agent_recovery.sql
        run: python3 -B scripts/ci/test-execution-brief-native-agent.py

      - name: Native execution brief review and revocation concurrency
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-execution-brief-native-concurrency.py

      - name: Institutional contribution concurrency
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-institutional-contribution-concurrency.py

      - name: Institutional source closure concurrency
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-institutional-closure-concurrency.py

      - name: Institutional native projection concurrency
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-institutional-native-concurrency.py

      - name: Verify competing ownership transfers serialize without residual authority
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-owner-transfer-concurrency.py

      - name: Verify contextual adoption compare-and-swap with two real sessions
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-adoption-concurrency.py

      - name: Verify contribution branches with two real concurrent sessions
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-contribution-concurrency.py
      - name: Concurrent human vault publication
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-vault-publication-concurrency.py

      - name: Concurrent method publication and adoption
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-method-publication-concurrency.py

      - name: Concurrent platform method publication
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-platform-method-concurrency.py

      - name: Concurrent pinned execution claims, operations and revocation
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-execution-concurrency.py

      - name: Concurrent governed evaluation reservation and assurance revocation
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-evaluation-concurrency.py

      # The governed evaluation consumer runs against this same disposable stack: the worker's own
      # RPC client and consumer, the evaluator's JWT session, and a cassette in place of the
      # provider. The gold baseline script then runs live against it as a child process with no
      # provider key in its environment, once through to its run record and once with the
      # assurance revoked. No provider key, no network beyond the local stack, synthetic data only.
      - name: Governed evaluation through the worker consumer and the baseline script, with a cassette provider
        if: ${{ !inputs.native_diagnostic }}
        env:
          OFFROAD_E2E_DATABASE_URL: ${{ steps.db.outputs.url }}
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          OFFROAD_E2E_API_URL="${API_URL:-http://127.0.0.1:54321}" OFFROAD_E2E_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}" \
            node scripts/ci/verify-governed-evaluation.mjs

      # The dependency recompute of stage 18 (3B) runs the same way: the worker's own recompute module
      # and RPC client, signed in as a synthetic worker account bound to its token. A root capital
      # execution is requested through the web path's composition, a new revision of its working
      # basis plans one zero-budget candidate, and the loop produces it once for the original
      # requester. No model, no provider key, no network beyond the local stack, synthetic data only.
      - name: Dependency recompute through the worker loop, once, against the local stack
        if: ${{ !inputs.native_diagnostic }}
        env:
          OFFROAD_E2E_DATABASE_URL: ${{ steps.db.outputs.url }}
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          OFFROAD_E2E_API_URL="${API_URL:-http://127.0.0.1:54321}" OFFROAD_E2E_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}" \
            node scripts/ci/verify-dependency-recompute.mjs

      - name: Concurrent R01 pause, release and policy revocation
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-r01-release-concurrency.py

      - name: Concurrent R01 evidence mutation and preparation
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-r01-integrity-concurrency.py

      - name: Concurrent dependency changes merge into one open update request
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-dependency-update-concurrency.py

      - name: Two workers racing for one recompute candidate lease it once
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-dependency-recompute-concurrency.py

      - name: Approval and planner, decline and worker, in both orders without a deadlock
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-work-update-integration-concurrency.py

      - name: Preserve stage-zero replay catalogue for drift diagnosis
        if: ${{ (always()) && !inputs.native_diagnostic }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage0-replay-catalogue
          path: ${{ runner.temp }}/stage0-replay-catalogue.json
          if-no-files-found: ignore

      - name: Schema lint (public, private)
        # Runs whenever the stack is up, even after an earlier contract step failed: a migration that
        # still fails the inventory check before it is applied must be linted before it is applied.
        if: ${{ (!cancelled() && steps.db.outcome == 'success') && !inputs.native_diagnostic }}
        run: supabase db lint --local --schema public,private --level warning --fail-on error

      # Stage 18, increment 6B: a human wait survives a worker restart. The proof registers the capital
      # method with a profile that can spend, and the capital method admits exactly one executable
      # profile and one requestable release, so it cannot share the database with the zero-budget
      # proof above: the local database is rebuilt from the migrations first (same registry mirror as
      # the boot, so nothing is pulled), and the proof runs on it last.
      # Both steps need the workspace dependencies: after a failed contract test the install above is
      # skipped, and the proof would fail with a missing module instead of being skipped.
      - name: Native M07 context capture under concurrent task output
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-capital-m07-context-stability-concurrency.py

      - name: Rebuild the local database for the wait proof
        id: wait_reset
        if: ${{ (!cancelled() && steps.db.outcome == 'success' && steps.database_deps.outcome == 'success') && !inputs.native_diagnostic }}
        # No step env here: the registry the boot used comes from GITHUB_ENV, and a step env would
        # override it.
        run: |
          set -euo pipefail
          started=$SECONDS
          supabase db reset --local
          echo "wait_proof_reset_seconds=$((SECONDS - started))"

      # A costed candidate waits for a person as an awaiting_human milestone, with no job and no lease,
      # through the worker loop and a restarted worker with its own token; after the owner's
      # authorization the restarted loop produces it once, with lineage. Synthetic data only, no
      # model, no provider key, no network beyond the local stack.
      - name: Dependency wait across a worker restart, against the rebuilt local stack
        if: ${{ (!cancelled() && steps.db.outcome == 'success' && steps.database_deps.outcome == 'success' && steps.wait_reset.outcome == 'success') && !inputs.native_diagnostic }}
        env:
          OFFROAD_E2E_DATABASE_URL: ${{ steps.db.outputs.url }}
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          started=$SECONDS
          OFFROAD_E2E_API_URL="${API_URL:-http://127.0.0.1:54321}" OFFROAD_E2E_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}" \
            node scripts/ci/verify-dependency-wait-restart.mjs
          echo "wait_proof_script_seconds=$((SECONDS - started))"

      # Keep append-only M07 evidence isolated from the earlier claim/race fixtures.
      # The always-run Supabase stop below destroys this local database and Storage.
      - name: Native M07 producer and physical recovery through the SDK
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
          OFFROAD_E2E_PUBLISHABLE_KEY: ${{ steps.db.outputs.publishable_key }}
        run: node scripts/ci/test-capital-m07-native-sdk.mjs

      - name: Native material production and human review through physical HTTP Storage
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
          OFFROAD_E2E_PUBLISHABLE_KEY: ${{ steps.db.outputs.publishable_key }}
        run: node scripts/ci/test-material-production-native-sdk.mjs

      # The wait proof resets the local database. Restore the same frozen candidate
      # in this second database lifetime before the native family catalogue and SDKs.
      - name: Reinstall native consumers after the local wait-proof reset
        id: native_consumers_reinstall
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_NATIVE_CONSUMERS_DRAFT_INSTALL: isolated-loopback-ci
        run: python3 -B scripts/ci/install-capital-consumers-ci-drafts.py

      - name: Native debt and S11 catalogue and hostile commands
        id: native_consumers_catalogue
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/support/capital_debt_execution_ledger.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/support/capital_s11_task_projections.sql

      - name: Native S11 initial and human return through real Storage and Edge
        if: ${{ !inputs.native_diagnostic || inputs.native_diagnostic_target != 'debt' }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
          OFFROAD_E2E_PUBLISHABLE_KEY: ${{ steps.db.outputs.publishable_key }}
          S11_HTTP_NAMESPACE: a8810001
        run: python3 -B scripts/ci/test-capital-s11-sdk.py

      - name: Native C11 initial and human return through real Storage and Edge
        # Independent families keep their failures visible in the same run.
        if: ${{ always() && steps.native_consumers_install.outcome == 'success' && (inputs.native_diagnostic || steps.native_consumers_reinstall.outcome == 'success') && steps.native_consumers_catalogue.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
          OFFROAD_E2E_PUBLISHABLE_KEY: ${{ steps.db.outputs.publishable_key }}
          DEBT_HTTP_NAMESPACE: a8820001
        run: python3 -B scripts/ci/test-capital-company-debt-sdk.py

      - name: Install assessment candidate only on disposable local database
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/install-assessment-native-local.py

      - name: Assessment writer denies missing captures and invalid authority
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          ASSESSMENT_DRAFT_IN_TRANSACTION: "0"
          MATERIAL_DRAFT_IN_TRANSACTION: "0"
        run: python3 -B scripts/ci/test-assessment-case-writer-guards.py
      - name: Native assessment and work adoption SQL boundaries
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          ASSESSMENT_DRAFT_IN_TRANSACTION: "0"
        run: python3 -B scripts/ci/test-assessment-native.py
      - name: Native assessment review and revocation two-session races
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-assessment-review-concurrency.py
      - name: Start the existing governed documentary scanner for own-source assessment
        env:
          CLAMD_HOST: 127.0.0.1
          CLAMD_PORT: "3310"
        run: bash scripts/ci/start-documentary-scanner.sh start
      - name: Nonempty institutional configuration through verified own-source physical SDK
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
          OFFROAD_E2E_PUBLISHABLE_KEY: ${{ steps.db.outputs.publishable_key }}
          CLAMD_HOST: 127.0.0.1
          CLAMD_PORT: "3310"
        run: node scripts/ci/test-assessment-institutional-native-sdk.mjs
      - name: Native assessment consumes licensed physical public bytes through the SDK
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
          OFFROAD_E2E_PUBLISHABLE_KEY: ${{ steps.db.outputs.publishable_key }}
        # The existing JWT-enabled Edge server above serves the candidate's
        # capital-body-read handler, including closed assessment_source.
        run: node scripts/ci/test-assessment-native-public-sdk.mjs

      - name: Stop the owned documentary scanner
        if: always()
        run: bash scripts/ci/start-documentary-scanner.sh stop

      # These families own their fixtures. A passed human-return proof may keep
      # original bytes until their real deadline; no later test may inherit that
      # global retention backlog or depend on runner speed to beat its expiry.
      - name: Rebuild the isolated database before native provider contracts
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -XAtq -v ON_ERROR_STOP=1 -c "select json_build_object('eval','provider_fixture_isolation','pending',count(*),'overdue',count(*) filter(where effective_purge_at<=clock_timestamp())) from private.capital_public_payload_purge_queue where status<>'purged';"
          supabase db reset --local
          psql "$DATABASE_URL" -XAtq -v ON_ERROR_STOP=1 -c "do \$\$ begin if exists(select 1 from private.capital_public_payload_purge_queue) then raise exception 'provider_fixture_isolation_failed';end if;end \$\$;"

      - name: Install unpublished deterministic provider draft in isolated CI only
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_NATIVE_PROVIDER_DRAFT_INSTALL: isolated-loopback-ci
        run: python3 -B scripts/ci/install-capital-provider-ci-draft.py

      - name: Native provider guards and retired writer negatives
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: |
          set -euo pipefail
          for test_file in provider_research_persistence provider_research_public_catalog_v2 provider_case_fit_persistence capital_native_provider_recipe capital_native_provider_results; do
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "supabase/tests/support/${test_file}.sql"
          done

      - name: Native provider catalogue SQL closure
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: node scripts/ci/test-capital-native-provider-sdk.mjs --sql-contracts

      - name: Native deterministic providers through real Storage and Edge
        if: ${{ !inputs.native_diagnostic }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
          OFFROAD_E2E_PUBLISHABLE_KEY: ${{ steps.db.outputs.publishable_key }}
        run: node scripts/ci/test-capital-native-provider-sdk.mjs

      # Preview is another independent family and produces its own real
      # other-family material. Destroy only this disposable CI database; do not
      # renew retained bytes, forge erasure ACKs or change production policy.
      - name: Rebuild the isolated database before native preview
        id: preview_reset
        if: ${{ !cancelled() && !inputs.native_diagnostic && steps.db.outcome == 'success' && steps.database_deps.outcome == 'success' }}
        run: |
          set -euo pipefail
          supabase db reset --local

      - name: Work review dashboard SQL and integrated runner target guards
        # Collect this independent review failure even when a preceding provider proof fails.
        if: ${{ !cancelled() && !inputs.native_diagnostic && steps.db.outcome == 'success' && steps.preview_reset.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_WORK_REVIEW_DRAFT_INSTALL: isolated-loopback-ci
        run: |
          set -euo pipefail
          python3 -B scripts/ci/install-work-review-dashboard-ci-draft.py
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/support/work_review_dashboard.sql
          node --test scripts/evals/stage20-integrated-review.test.mjs scripts/evals/stage20-material-review-adapter.test.mjs

      - name: Finite native preview through real Storage, two paid boundaries and replay
        if: ${{ !cancelled() && !inputs.native_diagnostic && steps.db.outcome == 'success' && steps.native_consumers_install.outcome == 'success' && steps.preview_reset.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
          OFFROAD_E2E_PUBLISHABLE_KEY: ${{ steps.db.outputs.publishable_key }}
          PREVIEW_DRAFTS_IN_LOCAL_STACK: "1"
          PREVIEW_HTTP_NAMESPACE: a8830001
          PREVIEW_INTEGRATED_REVIEW_EVAL: "1"
        run: |
          python3 -B scripts/ci/test-capital-preview-sdk.py
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/support/capital_preview_dispatch_policy.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/support/capital_preview_native_consumption.sql


      # These real races require committed fixtures. Keep them after every other
      # database/SDK contract, immediately before destroying the disposable stack.
      - name: Verify artifact roundtrip races before disposable stack teardown
        if: ${{ !cancelled() && !inputs.native_diagnostic && steps.db.outcome == 'success' }}
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/test-artifact-roundtrip-concurrency.py

      - name: Stop the capital body Edge reader
        if: always()
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/capital-body-edge"
          if [ -f "$runtime_dir/server.pid" ]; then
            runtime_pid="$(cat "$runtime_dir/server.pid")"
            if [[ "$runtime_pid" =~ ^[0-9]+$ ]]; then kill "$runtime_pid" 2>/dev/null || true; fi
          fi
          rm -rf -- "$runtime_dir"

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: ${{ inputs.native_diagnostic && 'Native material browser diagnostic (not a release gate)' || 'E2E (local Supabase + Playwright)' }}
    if: ${{ !inputs.native_diagnostic || inputs.native_diagnostic_target == 'material' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          # Pinned: resolving "latest" hits the GitHub API and can be rate-limited on busy days.
          version: 2.114.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Full local stack: Auth (OTP e-mails land in the local mail sink), PostgREST, Storage, Kong.
      - name: Log in to ghcr.io so image pulls are not anonymous and rate limited
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start local Supabase and apply migrations
        env:
          # ghcr.io keeps answering toomanyrequests for shared runners even when authenticated, and
          # public.ecr.aws answers "Data limit exceeded" once a shared runner address has spent its
          # anonymous quota. The Supabase CLI publishes the same images on both registries, so the
          # boot starts on the AWS mirror and switches registry on every retry.
          SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
        run: |
          set -o pipefail
          supabase stop --no-backup || true
          docker ps -aq --filter 'name=^supabase_.*_offroad$' | xargs -r docker rm -f
          # Retry the boot a few times, alternating registries with a pause, instead of failing the
          # whole gate on a registry limit.
          for attempt in 1 2 3 4 5; do
            if supabase start -x studio,imgproxy,edge-runtime,realtime,supavisor,postgres-meta 2>&1 | tee "$RUNNER_TEMP/supabase-start-e2e.log"; then break; fi
            if grep -q 'SQLSTATE' "$RUNNER_TEMP/supabase-start-e2e.log"; then exit 1; fi
            if [ "$attempt" = 5 ]; then echo "supabase start failed after 5 attempts"; exit 1; fi
            if [ "$SUPABASE_INTERNAL_IMAGE_REGISTRY" = public.ecr.aws ]; then
              SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io
            else
              SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws
            fi
            export SUPABASE_INTERNAL_IMAGE_REGISTRY
            echo "supabase start failed on attempt $attempt; waiting 90s before retrying from $SUPABASE_INTERNAL_IMAGE_REGISTRY"
            supabase stop --no-backup || true
            sleep 90
          done
          # A later step that recreates a container (the database rebuild) must name the registry
          # the images came from, or it pulls them again.
          echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=$SUPABASE_INTERNAL_IMAGE_REGISTRY" >> "$GITHUB_ENV"

      - name: Verify execution bytes through PostgreSQL storage
        env:
          OFFROAD_E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm --filter @offroad/evals exec tsx ../agent-contracts/scripts/verify-execution-bytes.ts

      # This stack has no document worker, so the journey test runs the deterministic extractor:
      # with the pipeline on, intake correctly waits in `processing` for a worker that does not
      # exist here and the review screen never arrives. The pipeline is measured on its own, on
      # real documents, by the `Measure extraction` workflow.
      - name: Run the journey against the deterministic extractor
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          if [ -z "$DB_URL" ]; then
            DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q \
            -c "alter table public.organizations alter column pipeline_enabled set default false;"

      - name: Export local Supabase configuration for the app and the tests
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-${ANON_KEY}}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "E2E_MAIL_URL=${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}" >> "$GITHUB_ENV"

      # NEXT_PUBLIC_* values are inlined at build time, so the build must run after the export above.
      - name: Install native consumers for the disposable browser stack
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          OFFROAD_NATIVE_CONSUMERS_DRAFT_INSTALL: isolated-loopback-ci
        run: python3 -B scripts/ci/install-capital-consumers-ci-drafts.py

      - name: Install assessment candidate for the disposable browser stack
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: python3 -B scripts/ci/install-assessment-native-local.py

      - name: Install review dashboard on the disposable browser stack
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          OFFROAD_WORK_REVIEW_DRAFT_INSTALL: isolated-loopback-ci
        run: python3 -B scripts/ci/install-work-review-dashboard-ci-draft.py


      - name: Build the web app against the local stack
        run: pnpm --filter web build

      # The integration_preview journey needs the worker: a service account that belongs to no
      # organization, its hashed token, and the grant that follows every organization created in
      # this stack. None of this touches production; the SQL file is not a migration.
      - name: Provision the local worker and the integration_preview grant
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          DB_URL="${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}"
          curl -sS -X POST "${API_URL}/auth/v1/signup" \
            -H "apikey: ${PUBLISHABLE_KEY:-${ANON_KEY}}" -H "Content-Type: application/json" \
            -d '{"email":"local-worker@offroad.invalid","password":"local-worker-password-2026"}' > /dev/null
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q \
            -c "update auth.users set email_confirmed_at = coalesce(email_confirmed_at, now()) where email = 'local-worker@offroad.invalid';"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -v mode=deterministic -q -f apps/web/e2e/support/integration-preview-local.sql

      # The worker ships as a bundle of first-party code with third-party packages external, so it
      # runs from a deployed tree with a hoisted node_modules, exactly as the image does.
      - name: Build and deploy the worker
        run: |
          set -euo pipefail
          pnpm --filter @offroad/document-worker... build
          pnpm deploy --legacy --filter @offroad/document-worker --prod --config.node-linker=hoisted "$RUNNER_TEMP/worker"
          out=$(cd "$RUNNER_TEMP/worker" && env -i PATH="$PATH" HOME=/tmp node dist/main.js 2>&1 || true)
          printf '%s' "$out" | grep -q 'worker configuration is invalid or incomplete' || { printf '%s\n' "$out" | head -5; echo 'the deployed worker bundle does not boot'; exit 1; }

      - name: Serve the authenticated capital body Edge reader
        env:
          OFFROAD_E2E_API_URL: http://127.0.0.1:54321
        run: |
          set -euo pipefail
          umask 077
          runtime_dir="$RUNNER_TEMP/capital-body-edge"
          mkdir -p "$runtime_dir"
          chmod 700 "$runtime_dir"
          # CLI injects built-in credentials into the server runtime only.
          # JWT verification stays enabled; no privileged key enters a client.
          supabase functions serve > "$runtime_dir/server.log" 2>&1 &
          echo "$!" > "$runtime_dir/server.pid"
          python3 -B scripts/ci/verify-capital-body-edge-ready.py


      # `--with-deps` runs apt-get, which stalled on the Azure mirror three times
      # (PR #57 ~30 min, PR #58 twice ~15 min each), always right after
      # "Get:1 file:/etc/apt/apt-mirrors.txt Mirrorlist". The same logs show the
      # Chromium libraries (libnss3, libgbm1, libxkbcommon0, libpango, …) are already
      # present on the runner image, so we install the browser only and let a missing
      # library fail loudly instead of hanging. The cache skips the download entirely
      # on repeat runs, and the timeout turns any future stall into a fast failure.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install chromium
        timeout-minutes: 6

      # This focal SDK leases and completes its own native job. Run it before the
      # global queue consumer; it must not race that consumer for the same job.
      - name: Native material browser journey before the global queue consumer
        run: |
          set -euo pipefail
          pnpm --filter web exec playwright test e2e/material-package-native.spec.ts --output=test-results-material
        env:
          CI: "true"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-material
          OFFROAD_E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Start the governed documentary scanner for artifact roundtrip
        if: ${{ !inputs.native_diagnostic }}
        env:
          CLAMD_HOST: 127.0.0.1
          CLAMD_PORT: "3310"
        run: bash scripts/ci/start-documentary-scanner.sh start

      - name: Start the worker
        if: ${{ !inputs.native_diagnostic }}
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export SUPABASE_URL="${API_URL}"
          export SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-${ANON_KEY}}"
          export WORKER_ACCOUNT_EMAIL="local-worker@offroad.invalid"
          export WORKER_ACCOUNT_PASSWORD="local-worker-password-2026"
          export OFFROAD_WORKER_TOKEN="e2e-worker-token-e2e-worker-token-e2e-worker-token-e2e-worker-token-"
          export REQUIRE_VIRUS_SCAN=true
          export CLAMD_HOST=127.0.0.1
          export CLAMD_PORT=3310
          export IDLE_POLL_SECONDS=2
          export LOG_LEVEL=info
          nohup node "$RUNNER_TEMP/worker/dist/main.js" > worker.log 2>&1 &
          echo $! > worker.pid
          sleep 5
          if ! kill -0 "$(cat worker.pid)" 2>/dev/null; then cat worker.log; exit 1; fi
          grep -q '"event":"worker.signed_in"' worker.log || (sleep 10; grep -q '"event":"worker.signed_in"' worker.log || (cat worker.log; exit 1))

      - name: Verify pinned execution through the deployed worker
        if: ${{ !inputs.native_diagnostic }}
        env:
          OFFROAD_E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/ci/verify-pinned-consumer.mjs

      - name: Verify governed artifact export and reimport paths
        if: ${{ !inputs.native_diagnostic }}
        # Fail early on changed paths; every selected case remains a required release gate.
        run: |
          set -euo pipefail
          export OFFROAD_E2E_WORKER_PID="$(cat worker.pid)"
          pnpm --filter web exec playwright test --retries=0 --output=test-results-roundtrip --grep 'Office roundtrip preserves the base|stored preview downloads exact bytes|governed materials and model come from one exact revision|guided institutional setup calculates only after review|a mixed update of an execution and the financial model is adopted in one act'
        env:
          CI: "true"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-roundtrip
          OFFROAD_E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Run end-to-end tests
        if: ${{ !inputs.native_diagnostic }}
        # The native material case and changed roundtrip paths already ran in required steps.
        run: pnpm --filter web exec playwright test --grep-invert 'native internal material approval and revocation use the same exact basis on project and opportunity$|Office roundtrip preserves the base|stored preview downloads exact bytes|governed materials and model come from one exact revision|guided institutional setup calculates only after review|a mixed update of an execution and the financial model is adopted in one act'
        env:
          CI: "true"
          # Restricted to loopback by the synthetic sector-planning setup.
          OFFROAD_E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/playwright-report-material
            apps/web/test-results-material
            apps/web/playwright-report-roundtrip
            apps/web/test-results-roundtrip
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the capital body Edge reader
        if: always()
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/capital-body-edge"
          if [ -f "$runtime_dir/server.pid" ]; then
            runtime_pid="$(cat "$runtime_dir/server.pid")"
            if [[ "$runtime_pid" =~ ^[0-9]+$ ]]; then kill "$runtime_pid" 2>/dev/null || true; fi
          fi
          rm -rf -- "$runtime_dir"


      - name: Stop the worker and keep its log
        if: always()
        run: |
          if [ -f worker.pid ]; then kill "$(cat worker.pid)" 2>/dev/null || true; fi
          tail -n 200 worker.log || true

      - name: Upload the worker log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-worker-log
          path: worker.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
