name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

  database:
    name: Database (migrations, RLS, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned: resolving "latest" hits the GitHub API and can be rate-limited on busy days.
          version: 2.114.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Boots a fresh local stack and applies every file in supabase/migrations from
      # scratch. This proves the migration history is replayable and that no policy,
      # grant, or function depends on state that only exists in the hosted project.
      - name: Start local Supabase and apply migrations
        run: supabase start -x studio,imgproxy,edge-runtime,realtime,supavisor,postgres-meta

      - name: Resolve local database URL
        id: db
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          if [ -z "$DB_URL" ]; then
            DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          fi
          echo "url=$DB_URL" >> "$GITHUB_OUTPUT"

      - name: Tenant non-interference (RLS) test
        run: psql "${{ steps.db.outputs.url }}" -v ON_ERROR_STOP=1 -q -f supabase/tests/rls_non_interference.sql

      - name: Schema lint (public, private)
        run: supabase db lint --local --schema public,private --level warning --fail-on error

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: E2E (local Supabase + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned: resolving "latest" hits the GitHub API and can be rate-limited on busy days.
          version: 2.114.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Full local stack: Auth (OTP e-mails land in the local mail sink), PostgREST, Storage, Kong.
      - name: Start local Supabase and apply migrations
        run: supabase start -x studio,imgproxy,edge-runtime,realtime,supavisor,postgres-meta

      - name: Export local Supabase configuration for the app and the tests
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-${ANON_KEY}}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "E2E_MAIL_URL=${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}" >> "$GITHUB_ENV"

      # NEXT_PUBLIC_* values are inlined at build time, so the build must run after the export above.
      - name: Build the web app against the local stack
        run: pnpm --filter web build

      # `--with-deps` runs apt-get, which stalled on the Azure mirror three times
      # (PR #57 ~30 min, PR #58 twice ~15 min each), always right after
      # "Get:1 file:/etc/apt/apt-mirrors.txt Mirrorlist". The same logs show the
      # Chromium libraries (libnss3, libgbm1, libxkbcommon0, libpango, …) are already
      # present on the runner image, so we install the browser only and let a missing
      # library fail loudly instead of hanging. The cache skips the download entirely
      # on repeat runs, and the timeout turns any future stall into a fast failure.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install chromium
        timeout-minutes: 6

      - name: Run end-to-end tests
        run: pnpm --filter web exec playwright test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
