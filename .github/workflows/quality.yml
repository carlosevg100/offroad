name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm check

  database:
    name: Database (migrations, RLS, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          # Pinned: resolving "latest" hits the GitHub API and can be rate-limited on busy days.
          version: 2.114.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Boots a fresh local stack and applies every file in supabase/migrations from
      # scratch. This proves the migration history is replayable and that no policy,
      # grant, or function depends on state that only exists in the hosted project.
      #
      # The exclusion list is a correctness fix, not a speed one. This job failed on run
      # 32383127190 with `failed to bind host port 0.0.0.0:54324 ... address already in use`
      # for `supabase_inbucket` — after all 27 migrations had applied. A mail catcher has
      # nothing to do with migrations, RLS, or lint, and neither does the analytics pair, so
      # every host port they bind is a way for this job to fail for reasons unrelated to the
      # change under test. (`mailpit` is the CLI's name for the container still called
      # `supabase_inbucket_*`.)
      #
      # gotrue, postgrest, storage-api and kong deliberately stay: the RLS test writes to
      # `auth.users` and reads `auth.uid()`, and the DB URL is resolved from `supabase status`.
      # Dropping those is plausible but unverified, and this job is the last gate before a
      # migration reaches the only Supabase project we have.
      - name: Start local Supabase and apply migrations
        run: |
          # A previous CLI attempt can leave a stopped-but-not-removed project container on a
          # recycled hosted runner. Remove only this repository's exact local stack before boot.
          supabase stop --no-backup || true
          docker ps -aq --filter 'name=^supabase_.*_offroad$' | xargs -r docker rm -f
          supabase start -x studio,imgproxy,edge-runtime,realtime,supavisor,postgres-meta,mailpit,logflare,vector

      - name: Resolve local database URL
        id: db
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          if [ -z "$DB_URL" ]; then
            DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          fi
          echo "url=$DB_URL" >> "$GITHUB_OUTPUT"

      # Every SQL contract is a gate by default. A newly added workspace, cache or
      # RLS regression test must not depend on someone remembering to register it here.
      - name: Run all database contract tests
        run: |
          set -euo pipefail
          for test_file in supabase/tests/*.sql; do
            echo "Running ${test_file}"
            psql "${{ steps.db.outputs.url }}" -v ON_ERROR_STOP=1 -q -f "${test_file}"
          done

      - name: Schema lint (public, private)
        run: supabase db lint --local --schema public,private --level warning --fail-on error

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: E2E (local Supabase + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          # Pinned: resolving "latest" hits the GitHub API and can be rate-limited on busy days.
          version: 2.114.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Full local stack: Auth (OTP e-mails land in the local mail sink), PostgREST, Storage, Kong.
      - name: Start local Supabase and apply migrations
        run: |
          supabase stop --no-backup || true
          docker ps -aq --filter 'name=^supabase_.*_offroad$' | xargs -r docker rm -f
          supabase start -x studio,imgproxy,edge-runtime,realtime,supavisor,postgres-meta

      # This stack has no document worker, so the journey test runs the deterministic extractor:
      # with the pipeline on, intake correctly waits in `processing` for a worker that does not
      # exist here and the review screen never arrives. The pipeline is measured on its own, on
      # real documents, by the `Measure extraction` workflow.
      - name: Run the journey against the deterministic extractor
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          if [ -z "$DB_URL" ]; then
            DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q \
            -c "alter table public.organizations alter column pipeline_enabled set default false;"

      - name: Export local Supabase configuration for the app and the tests
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-${ANON_KEY}}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "E2E_MAIL_URL=${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}" >> "$GITHUB_ENV"

      # NEXT_PUBLIC_* values are inlined at build time, so the build must run after the export above.
      - name: Build the web app against the local stack
        run: pnpm --filter web build

      # The integration_preview journey needs the worker: a service account that belongs to no
      # organization, its hashed token, and the grant that follows every organization created in
      # this stack. None of this touches production; the SQL file is not a migration.
      - name: Provision the local worker and the integration_preview grant
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          DB_URL="${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}"
          curl -sS -X POST "${API_URL}/auth/v1/signup" \
            -H "apikey: ${PUBLISHABLE_KEY:-${ANON_KEY}}" -H "Content-Type: application/json" \
            -d '{"email":"local-worker@offroad.invalid","password":"local-worker-password-2026"}' > /dev/null
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q \
            -c "update auth.users set email_confirmed_at = coalesce(email_confirmed_at, now()) where email = 'local-worker@offroad.invalid';"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -v mode=deterministic -q -f apps/web/e2e/support/integration-preview-local.sql

      # The worker ships as a bundle of first-party code with third-party packages external, so it
      # runs from a deployed tree with a hoisted node_modules, exactly as the image does.
      - name: Build and deploy the worker
        run: |
          set -euo pipefail
          pnpm --filter @offroad/document-worker... build
          pnpm deploy --legacy --filter @offroad/document-worker --prod --config.node-linker=hoisted "$RUNNER_TEMP/worker"
          out=$(cd "$RUNNER_TEMP/worker" && env -i PATH="$PATH" HOME=/tmp node dist/main.js 2>&1 || true)
          printf '%s' "$out" | grep -q 'worker configuration is invalid or incomplete' || { printf '%s\n' "$out" | head -5; echo 'the deployed worker bundle does not boot'; exit 1; }

      - name: Start the worker
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export SUPABASE_URL="${API_URL}"
          export SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-${ANON_KEY}}"
          export WORKER_ACCOUNT_EMAIL="local-worker@offroad.invalid"
          export WORKER_ACCOUNT_PASSWORD="local-worker-password-2026"
          export OFFROAD_WORKER_TOKEN="e2e-worker-token-e2e-worker-token-e2e-worker-token-e2e-worker-token-"
          export REQUIRE_VIRUS_SCAN=false
          export IDLE_POLL_SECONDS=2
          export LOG_LEVEL=info
          nohup node "$RUNNER_TEMP/worker/dist/main.js" > worker.log 2>&1 &
          echo $! > worker.pid
          sleep 5
          if ! kill -0 "$(cat worker.pid)" 2>/dev/null; then cat worker.log; exit 1; fi
          grep -q '"event":"worker.signed_in"' worker.log || (sleep 10; grep -q '"event":"worker.signed_in"' worker.log || (cat worker.log; exit 1))

      # `--with-deps` runs apt-get, which stalled on the Azure mirror three times
      # (PR #57 ~30 min, PR #58 twice ~15 min each), always right after
      # "Get:1 file:/etc/apt/apt-mirrors.txt Mirrorlist". The same logs show the
      # Chromium libraries (libnss3, libgbm1, libxkbcommon0, libpango, …) are already
      # present on the runner image, so we install the browser only and let a missing
      # library fail loudly instead of hanging. The cache skips the download entirely
      # on repeat runs, and the timeout turns any future stall into a fast failure.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install chromium
        timeout-minutes: 6

      - name: Run end-to-end tests
        run: pnpm --filter web exec playwright test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the worker and keep its log
        if: always()
        run: |
          if [ -f worker.pid ]; then kill "$(cat worker.pid)" 2>/dev/null || true; fi
          tail -n 200 worker.log || true

      - name: Upload the worker log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-worker-log
          path: worker.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
