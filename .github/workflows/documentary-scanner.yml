name: Documentary scanner smoke

on:
  pull_request:
    paths:
      - '.github/workflows/documentary-scanner.yml'
      - '.github/workflows/live-preview-gate.yml'
      - 'scripts/ci/start-documentary-scanner.sh'
      - 'scripts/ci/documentary-scanner-preflight.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Start scanner and verify clean and EICAR controls
        timeout-minutes: 8
        run: bash scripts/ci/start-documentary-scanner.sh
      - name: Stop owned scanner
        if: always()
        run: bash scripts/ci/start-documentary-scanner.sh stop
