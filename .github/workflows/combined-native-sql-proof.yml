name: Temporary combined native SQL proof (not a release gate)
on:
  push:
    branches: [codex/etapa20-combined-native-proof]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: combined-native-sql-proof-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  combined-sql:
    name: Frozen eleven consumers then six assessment SQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audit harness only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: audit
      - name: Checkout immutable canonical baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 16fb3a0bf303f85ba637aba458c68925e1908a5b
          path: baseline
      - name: Checkout frozen consumers installer and contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e48084c4c2b0b82b9955e50f7f3eb2885cc096c6
          path: consumers
      - name: Checkout frozen assessment installer and contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5fe11f9a5be67e229f1515ba1708e751e891c4fa
          path: assessment
      - name: Set up canonical Node24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: baseline/.nvmrc
      - name: Verify frozen hashes and harness guards without SQL
        run: python3 -B audit/scripts/ci/test-combined-native-consumers-assessment.py --consumers-root consumers --assessment-root assessment --self-test
      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.114.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Authenticate image registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Start dedicated Supabase and replay canonical migrations
        working-directory: baseline
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
        run: |
          set -euo pipefail
          supabase stop --no-backup || true
          docker ps -aq --filter 'name=^supabase_.*_offroad$' | xargs -r docker rm -f
          for attempt in 1 2 3 4 5; do
            if supabase start -x studio,imgproxy,edge-runtime,realtime,supavisor,postgres-meta,mailpit,logflare,vector; then break; fi
            if [ "$attempt" = 5 ]; then echo 'Supabase boot exhausted'; exit 1; fi
            if [ "$SUPABASE_INTERNAL_IMAGE_REGISTRY" = public.ecr.aws ]; then
              SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io
            else
              SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws
            fi
            export SUPABASE_INTERNAL_IMAGE_REGISTRY
            supabase stop --no-backup || true
            sleep 90
          done
      - name: Install seventeen frozen drafts and prove combined contracts
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          OFFROAD_COMBINED_NATIVE_EVAL: isolated-loopback-ci
        run: python3 -B audit/scripts/ci/test-combined-native-consumers-assessment.py --consumers-root consumers --assessment-root assessment
      - name: Destroy dedicated stack without backup
        if: ${{ always() }}
        working-directory: baseline
        run: supabase stop --no-backup
