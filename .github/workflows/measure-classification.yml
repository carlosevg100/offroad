name: Measure classification

# Runs the real classifier over a gold case and reports what it actually got (E1).
#
# The sibling of `measure-extraction.yml`, and the reason it exists is the gap between them.
# Extraction has been measured for weeks, but that measurement hands the extractor the *correct*
# document kind on purpose, to isolate the two stages. In production nothing hands it anything:
# the classifier decides, and a wrong kind is not a small error downstream, it is the wrong field
# set asked of the wrong document. Until this workflow, that half had no number at all.
#
# Same posture as its sibling. This job holds no provider key: the documents are parsed here and
# the script requests a governed evaluation through the evaluator's own Supabase session; the
# worker classifies with the provider credentials it already holds, reserving every call in the
# database first, and the script compares what the database committed with the gold, whose
# expected profiles never leave the job. `offroadGitHubEvalsRole` reads only the evaluator secret
# and the publishable key the worker also reads.
#
# NOT USABLE YET, by design. The secret `offroad/evaluator` (JSON with `email`, `password` and
# `organizationId`), the evaluator account it names and the evaluation organization do not exist
# yet: they are created by the founder's decision, together with the role's read grant on that
# secret and on `offroad/supabase-publishable-key`, the provider assurances for purpose
# `evaluation` and the opening of the transport switch. Until then this job fails closed with a
# named message and requests nothing. The worker must also run a release that carries the
# `measure-classification` family.
#
# Budget: `max_cost` has no default, because what a measurement spends is decided by whoever
# dispatches it. Each classification reserves the list-price upper bound of its whole request
# before it is sent (up to about 0.10 USD per document on the primary route for rede-horizonte),
# so a budget that cannot cover the next reservation ends the run partial with budget_exhausted.
# Manual only: once opened, it spends real money with the providers through the worker.

on:
  workflow_dispatch:
    inputs:
      case:
        description: "Gold case to measure"
        required: false
        default: "rede-horizonte"
      max_cost:
        description: "Budget in USD for the whole run, reservations included (no default)"
        required: true
      request_id:
        description: "Resume an earlier request by its id instead of creating another evaluation"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  # One group per case: dispatching five cases queued four and cancelled three, because a
  # workflow-level group keeps one pending run. Cases are independent; they run side by side.
  group: measure-classification-${{ inputs.case || 'rede-horizonte' }}
  cancel-in-progress: false

jobs:
  measure:
    name: Classify and score
    if: github.repository == 'carlosevg100/offroad' && github.ref == 'refs/heads/main'
    environment: intent-router-gold-main
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC, no stored key)
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::389642461544:role/offroadGitHubEvalsRole
          aws-region: sa-east-1

      - name: Run the classifier through the governed evaluation transport and score it
        env:
          CASE: ${{ inputs.case || 'rede-horizonte' }}
          MAX_COST: ${{ inputs.max_cost }}
          REQUEST_ID: ${{ inputs.request_id }}
          # The production project, as the worker's task definition names it; not a secret.
          SUPABASE_URL: https://ifnogpksgdadruooqydi.supabase.co
        run: |
          set -euo pipefail
          # The evaluator's credential and the evaluation organization. Absent until the founder
          # creates them: fail closed, by name, before anything is requested. Nothing read here is
          # ever printed, and each value is masked the moment it exists.
          if ! evaluator="$(aws secretsmanager get-secret-value --secret-id offroad/evaluator --query SecretString --output text 2>/dev/null)" || [ -z "$evaluator" ]; then
            echo "::error title=Governed evaluation not configured::offroad/evaluator is absent or not readable by offroadGitHubEvalsRole. The evaluator account, the evaluation organization and this secret are created by the founder's decision; nothing was requested."
            exit 1
          fi
          while IFS= read -r line; do if [ -n "$line" ]; then echo "::add-mask::$line"; fi; done <<<"$evaluator"
          field() { jq -er --arg key "$1" '.[$key] | select(type == "string" and length > 0)' <<<"$evaluator" 2>/dev/null; }
          if ! OFFROAD_EVALUATOR_EMAIL="$(field email)" || ! OFFROAD_EVALUATOR_PASSWORD="$(field password)" || ! OFFROAD_EVALUATION_ORGANIZATION_ID="$(field organizationId)"; then
            echo "::error title=Governed evaluation not configured::offroad/evaluator must hold email, password and organizationId; nothing was requested."
            exit 1
          fi
          echo "::add-mask::$OFFROAD_EVALUATOR_EMAIL"
          echo "::add-mask::$OFFROAD_EVALUATOR_PASSWORD"
          echo "::add-mask::$OFFROAD_EVALUATION_ORGANIZATION_ID"
          unset evaluator
          if ! SUPABASE_PUBLISHABLE_KEY="$(aws secretsmanager get-secret-value --secret-id offroad/supabase-publishable-key --query SecretString --output text 2>/dev/null)" || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error title=Governed evaluation not configured::offroad/supabase-publishable-key is not readable by offroadGitHubEvalsRole; the founder's setup grants it with the evaluator secret. Nothing was requested."
            exit 1
          fi
          echo "::add-mask::$SUPABASE_PUBLISHABLE_KEY"
          export SUPABASE_URL SUPABASE_PUBLISHABLE_KEY OFFROAD_EVALUATOR_EMAIL OFFROAD_EVALUATOR_PASSWORD OFFROAD_EVALUATION_ORGANIZATION_ID

          resume=()
          if [ -n "$REQUEST_ID" ]; then resume=(--request-id "$REQUEST_ID"); fi
          status=0
          pnpm --filter @offroad/evals measure:classification -- "$CASE" --max-cost "$MAX_COST" ${resume[@]+"${resume[@]}"} 2>&1 \
            | grep -vE 'Warning: (TT|Required "glyf"|UnknownErrorException)' | tee /tmp/classification.log || status=$?

          {
            echo "## Classification measurement: $CASE"
            echo
            grep -E '^evaluation (snapshot|routes|budget|requested|committed)' /tmp/classification.log | sed 's/^/- /' || true
            echo
            echo '```'
            sed -n '/^=\{10,\}/,$p' /tmp/classification.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Status 3 is a partial evaluation: its evidence is uploaded below, and the run fails.
          exit "$status"

      - name: Keep the full report and the evaluation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: classification-measurement
          path: packages/evals/results/
          if-no-files-found: warn
          retention-days: 30
