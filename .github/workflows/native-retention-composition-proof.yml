name: Native retention composition proof (diagnostic only)
on:
  push:
    branches: [codex/etapa20-retention-proof]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retention-composition:
    name: C11 revocation to public assessment physical proof (not release)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          # Pinned: resolving "latest" hits the GitHub API and can be rate-limited on busy days.
          version: 2.114.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Log in to ghcr.io so image pulls are not anonymous and rate limited
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Start local Supabase and apply migrations
        env:
          # ghcr.io keeps answering toomanyrequests for shared runners even when authenticated, and
          # public.ecr.aws answers "Data limit exceeded" once a shared runner address has spent its
          # anonymous quota. The Supabase CLI publishes the same images on both registries, so the
          # boot starts on the AWS mirror and switches registry on every retry.
          SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
        run: |
          # A previous CLI attempt can leave a stopped-but-not-removed project container on a
          # recycled hosted runner. Remove only this repository's exact local stack before boot.
          supabase stop --no-backup || true
          docker ps -aq --filter 'name=^supabase_.*_offroad$' | xargs -r docker rm -f
          # Retry the boot a few times, alternating registries with a pause, instead of failing the
          # whole gate on a registry limit.
          for attempt in 1 2 3 4 5; do
            if supabase start -x studio,imgproxy,edge-runtime,realtime,supavisor,postgres-meta,mailpit,logflare,vector; then break; fi
            if [ "$attempt" = 5 ]; then echo "supabase start failed after 5 attempts"; exit 1; fi
            if [ "$SUPABASE_INTERNAL_IMAGE_REGISTRY" = public.ecr.aws ]; then
              SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io
            else
              SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws
            fi
            export SUPABASE_INTERNAL_IMAGE_REGISTRY
            echo "supabase start failed on attempt $attempt; waiting 90s before retrying from $SUPABASE_INTERNAL_IMAGE_REGISTRY"
            supabase stop --no-backup || true
            sleep 90
          done
          # A later step that recreates a container (the database rebuild) must name the registry
          # the images came from, or it pulls them again.
          echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=$SUPABASE_INTERNAL_IMAGE_REGISTRY" >> "$GITHUB_ENV"

      - name: Resolve local database URL
        id: db
        run: |
          set -euo pipefail
          STATUS_ENV="$(supabase status -o env)"
          DB_URL="$(printf '%s\n' "$STATUS_ENV" | sed -n 's/^DB_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          if [ -z "$DB_URL" ]; then
            DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          fi
          echo "url=$DB_URL" >> "$GITHUB_OUTPUT"
          API_URL="$(printf '%s\n' "$STATUS_ENV" | sed -n 's/^API_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          PUBLISHABLE_KEY="$(printf '%s\n' "$STATUS_ENV" | sed -n 's/^PUBLISHABLE_KEY="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          if [ -z "$PUBLISHABLE_KEY" ]; then
            PUBLISHABLE_KEY="$(printf '%s\n' "$STATUS_ENV" | sed -n 's/^ANON_KEY="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          fi
          if [ -z "$API_URL" ] || [ -z "$PUBLISHABLE_KEY" ]; then
            echo 'Local Supabase API URL or publishable key unavailable' >&2
            exit 1
          fi
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "publishable_key=$PUBLISHABLE_KEY" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        id: database_deps
        run: pnpm install --frozen-lockfile

      - name: Install unpublished native consumer drafts in isolated CI only
        id: native_consumers_install
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_NATIVE_CONSUMERS_DRAFT_INSTALL: isolated-loopback-ci
        run: python3 -B scripts/ci/install-capital-consumers-ci-drafts.py

      - name: Serve the authenticated capital body Edge reader
        env:
          OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
        run: |
          set -euo pipefail
          umask 077
          runtime_dir="$RUNNER_TEMP/capital-body-edge"
          mkdir -p "$runtime_dir"
          chmod 700 "$runtime_dir"
          # CLI injects built-in credentials into the server runtime only.
          # JWT verification stays enabled; no privileged key enters a client.
          supabase functions serve > "$runtime_dir/server.log" 2>&1 &
          echo "$!" > "$runtime_dir/server.pid"
          python3 -B scripts/ci/verify-capital-body-edge-ready.py

      - name: Native C11 initial and human return through real Storage and Edge
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
          OFFROAD_E2E_PUBLISHABLE_KEY: ${{ steps.db.outputs.publishable_key }}
          DEBT_HTTP_NAMESPACE: a8820001
        run: python3 -B scripts/ci/test-capital-company-debt-sdk.py

      - name: Install assessment candidate only on disposable local database
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: python3 -B scripts/ci/install-assessment-native-local.py

      - name: Native assessment consumes licensed physical public bytes through the SDK
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          OFFROAD_E2E_API_URL: ${{ steps.db.outputs.api_url }}
          OFFROAD_E2E_PUBLISHABLE_KEY: ${{ steps.db.outputs.publishable_key }}
        # The existing JWT-enabled Edge server above serves the candidate's
        # capital-body-read handler, including closed assessment_source.
        run: node scripts/ci/test-assessment-native-public-sdk.mjs

      - name: Stop the capital body Edge reader
        if: always()
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/capital-body-edge"
          if [ -f "$runtime_dir/server.pid" ]; then
            runtime_pid="$(cat "$runtime_dir/server.pid")"
            if [[ "$runtime_pid" =~ ^[0-9]+$ ]]; then kill "$runtime_pid" 2>/dev/null || true; fi
          fi
          rm -rf -- "$runtime_dir"

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
