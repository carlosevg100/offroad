name: Architecture decision
description: Propose a material, difficult-to-reverse technical or operational decision.
title: "[ADR]: "
labels: ["architecture"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context and forces
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Recommended decision
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Consequences, cost and rollback
    validations:
      required: true
